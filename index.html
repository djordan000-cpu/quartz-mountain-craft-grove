// ============================================================================
// ASSET MANAGER - loads atlases and provides frame metadata
// ============================================================================
class AssetManager {
  constructor() {
    this.atlases = {};   // character -> Image
    this.metadata = null;
    this.loaded = 0;
    this.total = 7; // 6 atlases + 1 json
  }

  async loadAll(onProgress) {
    // Load metadata first
    const resp = await fetch('assets/atlases.json');
    this.metadata = await resp.json();
    onProgress(++this.loaded, this.total);

    // Load each atlas image
    const names = ['naruto', 'sasuke', 'sakura', 'kakashi', 'fx', 'fx2'];
    const promises = names.map(name => this._loadImage(`assets/${name}_atlas.png`, name, onProgress));
    await Promise.all(promises);
  }

  _loadImage(src, name, onProgress) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        this.atlases[name] = img;
        onProgress(++this.loaded, this.total);
        resolve(img);
      };
      img.onerror = () => { console.error(`Failed to load ${src}`); reject(new Error(src)); };
      img.src = src;
    });
  }

  // Get frame metadata for a character/state/frameIdx
  // The atlases have no sprites for a few states (intro, sub, chakra_dash, linked).
  // Fall back to a similar animation instead of drawing nothing (invisible fighter).
  _resolveState(charMeta, state) {
    const FALLBACK = { linked: 'ultimate', sub: 'fall', chakra_dash: 'jump', intro: 'idle', defeated: 'hit',
      rasenshuriken: 'shuriken', clone_barrage: 'ninjutsu', rendan: 'air_atk', fireball: 'ninjutsu', kirin: 'ninjutsu', phoenix: 'air_atk' };
    let s = state;
    for (let i = 0; i < 3; i++) {
      if (charMeta[s] && charMeta[s].length) return s;
      s = FALLBACK[s] || 'idle';
    }
    return 'idle';
  }

  // Frame list for a character/state: signature moves pick frames out of other animations (ANIM_MAP)
  // New characters without custom atlases fall back to a similar existing character's frames.
  _spriteFallback(character) {
    const MAP = {
      gaara: 'naruto', hinata: 'sakura', neji: 'kakashi',
      haku: 'sasuke', rock_lee: 'naruto', kisame: 'kakashi'
    };
    return MAP[character] || character;
  }
  _frames(character, state) {
    let charMeta = this.metadata[character];
    if (!charMeta) {
      const fb = this._spriteFallback(character);
      charMeta = this.metadata[fb];
      if (!charMeta) return null;
    }
    const map = ANIM_MAP[character] && ANIM_MAP[character][state];
    if (map) {
      const out = [];
      for (const [anim, idx] of map) {
        const fr = charMeta[anim] && charMeta[anim][idx];
        if (fr) out.push(fr);
      }
      if (out.length) return out;
    }
    return charMeta[this._resolveState(charMeta, state)];
  }

  getFrame(character, state, frameIdx) {
    const stateFrames = this._frames(character, state);
    if (!stateFrames || stateFrames.length === 0) return null;
    const idx = ((frameIdx % stateFrames.length) + stateFrames.length) % stateFrames.length;
    return stateFrames[idx];
  }

  getAnimLength(character, state) {
    const stateFrames = this._frames(character, state);
    return stateFrames ? stateFrames.length : 1;
  }

  // Return the atlas Image for a character, falling back for new roster members
  getAtlas(character) {
    if (this.atlases[character]) return this.atlases[character];
    const fb = this._spriteFallback(character);
    return this.atlases[fb] || this.atlases['naruto'];
  }

  // Frame of an extra-FX animation (fx2 atlas: rasengan, chidori, fireball, ...)
  getFx(group, idx) {
    const g = this.metadata.fx2 && this.metadata.fx2[group];
    if (!g || !g.length) return null;
    return g[((idx % g.length) + g.length) % g.length];
  }
}

// ============================================================================
// INPUT MAPPER - keyboard handling with multi-tap chakra detection
// ============================================================================
class InputState {
  constructor() {
    this.moveX = 0; this.moveY = 0;
    this.jumpPressed = false; this.jumpHeld = false;
    this.attackPressed = false; this.attackHeld = false;
    this.guardHeld = false; this.guardPressed = false;
    this.chakraHeld = false; this.chakraPressed = false;
    this.subPressed = false;
    this.changeLeaderPrev = false; this.changeLeaderNext = false;
    this.tiltDir = [0, 0]; this.tiltTriggered = false;
    this.ninjutsu = false; this.chakraDash = false;
    this.ultimate = false; this.linkedSecret = false;
    this.grab = false; this.counter = false;
    this.shuriken = false; this.assist = false;
  }
}

class InputMapper {
  constructor(keymap) {
    this.keys = keymap;
    this.state = new InputState();
    this.pressed = {};  // role -> bool (currently down)
    this._chakraTaps = [];  // timestamps
    this._lastJump = false; this._lastAttack = false; this._lastGuard = false; this._lastChakra = false;
    this._lastLeaderPrev = false; this._lastLeaderNext = false;
    this._lastShuriken = false; this._lastAssist = false; this._lastSub = false;
    this.tapped = {};   // role -> pressed at least once since last update (catches taps shorter than a frame)
    this._lastMoveX = 0; this._lastMoveY = 0;
    this._dirPressTime = 0;
    this._lastDirChange = 0;
    this.DOUBLE_TAP_WINDOW = 220;  // ms
    this.TRIPLE_TAP_WINDOW = 360;
    this.TILT_FLICK_WINDOW = 100;
  }

  keyDown(code) {
    for (const role in this.keys) {
      if (this.keys[role] === code) {
        this.pressed[role] = true;
        this.tapped[role] = true;
        return;
      }
    }
  }

  // Release everything (window lost focus -> keyup events never arrive -> stuck keys)
  releaseAll() {
    this.pressed = {};
    this.tapped = {};
  }

  keyUp(code) {
    for (const role in this.keys) {
      if (this.keys[role] === code) {
        this.pressed[role] = false;
      }
    }
  }

  isDown(role) { return !!this.pressed[role]; }

  update() {
    const s = this.state;
    // Reset derived
    s.tiltTriggered = false; s.tiltDir = [0, 0];
    s.ninjutsu = false; s.chakraDash = false;
    s.ultimate = false; s.linkedSecret = false;
    s.grab = false; s.counter = false;
    s.shuriken = false; s.assist = false;
    s.changeLeaderPrev = false; s.changeLeaderNext = false;
    s.jumpPressed = false; s.attackPressed = false;
    s.guardPressed = false; s.chakraPressed = false; s.subPressed = false;

    const mx = (this.isDown('right') ? 1 : 0) - (this.isDown('left') ? 1 : 0);
    const my = (this.isDown('down') ? 1 : 0) - (this.isDown('up') ? 1 : 0);
    s.moveX = mx; s.moveY = my;

    s.jumpHeld = this.isDown('jump');
    s.attackHeld = this.isDown('attack');
    s.guardHeld = this.isDown('guard');
    s.chakraHeld = this.isDown('chakra');

    const now = performance.now();
    // A key tapped and released between two frames still counts as a press
    const tap = (role) => !!this.tapped[role];
    s.jumpPressed = (s.jumpHeld && !this._lastJump) || (tap('jump') && !s.jumpHeld);
    s.attackPressed = (s.attackHeld && !this._lastAttack) || (tap('attack') && !s.attackHeld);
    s.guardPressed = s.guardHeld && !this._lastGuard;
    s.chakraPressed = (s.chakraHeld && !this._lastChakra) || (tap('chakra') && !s.chakraHeld);
    // Edge-trigger substitution so holding U doesn't burn every substitution slot in one combo
    s.subPressed = (this.isDown('sub') && !this._lastSub) || (tap('sub') && !this.isDown('sub'));
    // Edge-trigger leader swaps so holding the key doesn't cycle through all leaders
    s.changeLeaderPrev = (this.isDown('leader_prev') && !this._lastLeaderPrev) || (tap('leader_prev') && !this.isDown('leader_prev'));
    s.changeLeaderNext = (this.isDown('leader_next') && !this._lastLeaderNext) || (tap('leader_next') && !this.isDown('leader_next'));
    this.tapped = {};

    // Drop stale taps every frame (previously only pruned on a new tap, so an old double-tap
    // could turn a plain Ninjutsu into an Ultimate seconds later)
    this._chakraTaps = this._chakraTaps.filter(t => now - t <= this.TRIPLE_TAP_WINDOW);
    if (s.chakraPressed) this._chakraTaps.push(now);

    // Tilt detection: new direction pressed within flick window
    const dirChanged = (mx !== this._lastMoveX || my !== this._lastMoveY) && (mx !== 0 || my !== 0);
    if (dirChanged) this._dirPressTime = now;
    if (s.attackPressed) {
      const elapsed = now - this._dirPressTime;
      if (elapsed <= this.TILT_FLICK_WINDOW && (mx !== 0 || my !== 0)) {
        s.tiltTriggered = true;
        s.tiltDir = [mx, my];
      }
    }

    // Combined moves
    if (s.attackPressed && s.chakraHeld && s.guardHeld) {
      s.counter = true; s.attackPressed = false;
    } else if (s.attackPressed && s.guardHeld && !s.chakraHeld) {
      s.grab = true; s.attackPressed = false;
    } else if (s.attackPressed && s.chakraHeld && this._chakraTaps.length >= 3) {
      s.linkedSecret = true; s.attackPressed = false; this._chakraTaps = [];
    } else if (s.attackPressed && s.chakraHeld && this._chakraTaps.length >= 2) {
      s.ultimate = true; s.attackPressed = false; this._chakraTaps = [];
    } else if (s.attackPressed && s.chakraHeld) {
      s.ninjutsu = true; s.attackPressed = false;
    }
    if (s.jumpPressed && s.chakraHeld) {
      s.chakraDash = true; s.jumpPressed = false;
    }
    // Shuriken throw (edge-triggered, no chakra needed, just the key)
    const shurikenDown = this.isDown('shuriken');
    if (shurikenDown && !this._lastShuriken) {
      s.shuriken = true;
    }
    this._lastShuriken = shurikenDown;
    // Team assist (edge-triggered)
    const assistDown = this.isDown('assist');
    if (assistDown && !this._lastAssist) {
      s.assist = true;
    }
    this._lastAssist = assistDown;

    this._lastJump = s.jumpHeld;
    this._lastAttack = s.attackHeld;
    this._lastGuard = s.guardHeld;
    this._lastChakra = s.chakraHeld;
    this._lastLeaderPrev = this.isDown('leader_prev');
    this._lastLeaderNext = this.isDown('leader_next');
    this._lastSub = this.isDown('sub');
    this._lastMoveX = mx;
    this._lastMoveY = my;
  }
}

// ============================================================================
// FIGHTER
// ============================================================================
class Fighter {
  constructor(character, x, y, facing, teamId, assets) {
    this.character = character;
    this.teamId = teamId;
    this.data = CHARS_DATA[character];
    this.assets = assets;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.facing = facing;
    this.onGround = true;
    this.onWall = false; this.wallSide = 0;
    this.state = ST.INTRO;
    this.stateTimer = 0;
    this.animFrame = 0; this.animTimer = 0;
    this.chakra = CFG.MAX_CHAKRA;
    this.chakraLoadHeld = false;
    this.hitstun = 0;
    this.invuln = 0;
    this.blocking = false;
    this.comboCount = 0;
    this.comboBranchBuffer = null;
    this.awakened = false;
    this.awakenTimer = 0;
    this.defeated = false;
    this.cinematicFreeze = 0;
    this.flipLock = false;
    this._lastHitTargets = new Set();
    this.airDashUsed = false;
    // Guard system
    this.guard = 100;          // guard gauge; drains on blocked hits, regenerates when not blocking
    this.guardBreak = 0;       // frames left in which guarding is impossible after a guard break
    this.perfectWindow = 0;    // frames after tapping Guard in which a hit is a Perfect Block
    this.perfectFlash = 0;     // visual feedback timer
    this.blockFlash = 0;
    this.startX = x;
    // Signature moves: deferred spawn (fires when stateTimer reaches `at`) and the on-screen move name
    this.queued = null;
    this.pendingCallout = null;
  }

  // Can start a special (ninjutsu / ultimate / dash ...). Unlike canAct() this allows
  // cancelling out of a basic combo, but NOT re-triggering a special that is already running
  // (that used to drain chakra and add Storm every press without doing anything).
  canSpecial() {
    if (this.defeated || this.cinematicFreeze > 0 || this.hitstun > 0) return false;
    const locked = [ST.NINJUTSU, ST.ULTIMATE, ST.LINKED, ST.CHAKRA_DASH, ST.SUB,
                    ST.GRAB, ST.TILT, ST.SHURIKEN, ST.ASSIST,
                    ST.RASENSHURIKEN, ST.CLONES, ST.RENDAN, ST.FIREBALL, ST.KIRIN, ST.PHOENIX];
    return !locked.includes(this.state);
  }

  canAct() {
    if (this.defeated || this.cinematicFreeze > 0) return false;
    if (this.hitstun > 0) return false;
    const busyStates = [ST.ATTACK1, ST.ATTACK2, ST.ATTACK_UP, ST.ATTACK_DN, ST.TILT,
                        ST.GRAB, ST.NINJUTSU, ST.ULTIMATE, ST.LINKED, ST.AIR_ATK,
                        ST.CHAKRA_DASH, ST.SUB, ST.SHURIKEN, ST.ASSIST,
                        ST.RASENSHURIKEN, ST.CLONES, ST.RENDAN, ST.FIREBALL, ST.KIRIN, ST.PHOENIX];
    if (busyStates.includes(this.state)) return false;
    return true;
  }

  setState(newState, resetAnim = true) {
    if (this.state === newState) return;
    this.state = newState;
    this.stateTimer = 0;
    this.queued = null;   // a deferred signature-move spawn is cancelled when the move is interrupted
    // A new move can hit again. (The hit list was never cleared, so after the first
    // hit of the match you could never damage that opponent again.)
    this._lastHitTargets.clear();
    // flipLock is only meant to last for grab / ultimate / linked
    this.flipLock = false;
    if (resetAnim) { this.animFrame = 0; this.animTimer = 0; }
  }

  get hurtbox() {
    return { x: this.x - 40, y: this.y - 140, w: 80, h: 140 };
  }

  hitbox() {
    const info = MOVES[this.state];
    if (!info || info.active === 0) return null;
    // Shuriken / assist damage comes from the projectile / support fighter, not a melee box
    if (info.projectile || info.assist) return null;
    if (!(info.startup <= this.stateTimer && this.stateTimer < info.startup + info.active)) return null;
    let reach = 100;
    if ([ST.NINJUTSU, ST.ULTIMATE, ST.LINKED].includes(this.state)) reach = 160;
    if (this.state === ST.GRAB) reach = 80;
    if (this.state === ST.SHURIKEN) reach = 50;
    const hx = this.facing === 1 ? this.x + 10 : this.x - 10 - reach;
    return { x: hx, y: this.y - 130, w: reach, h: 120 };
  }

  applyInput(inp, opp, team, enemyTeam) {
    if (this.defeated || this.cinematicFreeze > 0) return;
    // Tapping Guard opens a short Perfect Block window
    if (inp.guardPressed && this.onGround && this.guardBreak === 0) this.perfectWindow = 8;
    // Substitution interrupts hitstun
    if (inp.subPressed && team.subs > 0 && this.hitstun > 0) {
      this._doSubstitution(team, opp);
      return;
    }
    // Counter
    if (inp.counter && this.chakra >= CFG.COUNTER_COST && this.canAct()) {
      this.chakra -= CFG.COUNTER_COST;
      this.setState(ST.TILT);
      this._tryCounter(opp, enemyTeam);
      return;
    }
    this.chakraLoadHeld = inp.chakraHeld;
    if (this.hitstun > 0) return;

    const special = this.canSpecial();
    if (special && inp.linkedSecret && team.storm >= 100 && this.chakra >= 30) {
      team.storm = 0; this.chakra -= 30;
      this.comboBranchBuffer = null;
      this.setState(ST.LINKED); this.flipLock = true; return;
    }
    if (special && inp.ultimate && this.chakra >= CFG.ULTIMATE_COST) {
      this.chakra -= CFG.ULTIMATE_COST;
      this.comboBranchBuffer = null;
      this.setState(ST.ULTIMATE); this.flipLock = true; return;
    }
    if (special && inp.ninjutsu && this._trySignature(inp, opp, team)) return;
    if (special && inp.ninjutsu && this.chakra >= CFG.NINJUTSU_COST) {
      this.chakra -= CFG.NINJUTSU_COST;
      this.comboBranchBuffer = null;
      this.setState(ST.NINJUTSU);
      team.storm = Math.min(100, team.storm + 5);
      return;
    }
    // Shuriken throw - costs chakra, creates a projectile
    if (inp.shuriken && this.chakra >= CFG.SHURIKEN_COST && this.canAct()) {
      this.chakra -= CFG.SHURIKEN_COST;
      this.setState(ST.SHURIKEN);
      this._throwShuriken(team);
      return;
    }
    // Team assist - costs storm gauge, calls support fighter
    if (inp.assist && team.storm >= CFG.ASSIST_STORM_COST && this.canAct()) {
      team.storm -= CFG.ASSIST_STORM_COST;
      this.setState(ST.ASSIST);
      this._callAssist(team, opp);
      return;
    }
    if (special && inp.chakraDash && this.chakra >= CFG.CHAKRA_DASH_COST) {
      this.chakra -= CFG.CHAKRA_DASH_COST;
      this.comboBranchBuffer = null;
      this._doChakraDash(opp);
      team.storm = Math.min(100, team.storm + 2);
      return;
    }
    if (inp.grab && this.canAct()) {
      this.setState(ST.GRAB); this.flipLock = true; return;
    }
    if (inp.chakraHeld && !this.awakened && this.canAct() && this._canAwaken(team)) {
      this._startAwakening(); return;
    }

    // Buffer combo branches during attack states
    if ([ST.ATTACK1, ST.ATTACK2, ST.ATTACK_UP, ST.ATTACK_DN, ST.AIR_ATK].includes(this.state)) {
      if (inp.attackPressed) {
        const info = MOVES[this.state];
        if (info.branch) this.comboBranchBuffer = info.branch;
      }
      return;
    }
    if (!this.canAct()) return;

    if (!this.flipLock && this.onGround && opp && !opp.defeated) {
      this.facing = opp.x > this.x ? 1 : -1;
    }

    this.blocking = inp.guardHeld && this.onGround && this.guardBreak === 0 && this.guard > 0;
    if (this.blocking) {
      if (this.state !== ST.BLOCK) this.setState(ST.BLOCK);
    } else if (this.state === ST.BLOCK) {
      this.setState(ST.IDLE);
    }

    if (inp.tiltTriggered && this.onGround) {
      this.setState(ST.TILT);
      this.comboBranchBuffer = null;
      return;
    }

    if (inp.jumpPressed && this.onGround) {
      this.vy = CFG.JUMP_VY;
      this.onGround = false; this.onWall = false;
      this.airDashUsed = false;
      this.setState(ST.JUMP);
    } else if (!this.onGround && inp.jumpPressed && inp.moveX !== 0 && !this.airDashUsed) {
      // Air dash: second jump press in the air. (Was a plain `if`, so the very same press
      // that started a jump while holding a direction also fired an air dash.)
      // One per jump - otherwise infinite i-frame dashing.
      this.airDashUsed = true;
      this.vx = CFG.AIR_DASH_VX * inp.moveX;
      if (this.state !== ST.JUMP) this.state = ST.JUMP;
      this.invuln = Math.max(this.invuln, 8);
    }

    if (inp.attackPressed) {
      if (!this.onGround) {
        this.setState(ST.AIR_ATK);
      } else if (inp.moveY < 0) {
        this.setState(ST.ATTACK_UP);
      } else if (inp.moveY > 0) {
        this.setState(ST.ATTACK_DN);
      } else {
        this.setState(this.comboCount === 0 ? ST.ATTACK1 : ST.ATTACK2);
      }
      return;
    }

    // Movement
    if (this.onGround) {
      if (inp.moveX !== 0) {
        // Keep facing the opponent while walking (walking backwards used to turn you around,
        // which also reversed your knockback direction when hit).
        if (!this.blocking && (!opp || opp.defeated || this.flipLock)) this.facing = inp.moveX;
        this.vx = inp.moveX * CFG.WALK_SPEED;
        if (this.awakened) this.vx *= CFG.AWAKEN_SPEED_BOOST;
        if (![ST.ATTACK1, ST.ATTACK2].includes(this.state) && this.state !== ST.WALK) {
          this.setState(ST.WALK);
        }
      } else {
        this.vx *= 0.5;
        if (this.state === ST.WALK) this.setState(ST.IDLE);
      }
    } else {
      if (inp.moveX !== 0) {
        const nearLeft = this.x <= CFG.LEFT_WALL + 40;
        const nearRight = this.x >= CFG.RIGHT_WALL - 40;
        if ((nearLeft && inp.moveX < 0) || (nearRight && inp.moveX > 0)) {
          this.vx = inp.moveX * 2;
          this.vy = Math.min(this.vy, CFG.WALL_RUN_VY) - 0.5;
          this.onWall = true;
          this.wallSide = nearLeft ? -1 : 1;
        } else {
          this.vx += inp.moveX * 0.5;
          this.vx = Math.max(-CFG.RUN_SPEED, Math.min(CFG.RUN_SPEED, this.vx));
        }
      }
    }
  }

  // ---------- SIGNATURE MOVES (Naruto / Sasuke) ----------
  // Ninjutsu input + Up / Down (or Down in the air) picks the character's signature move.
  _trySignature(inp, opp, team) {
    const map = SIGNATURES[this.character];
    if (!map) return false;
    let key = null;
    if (!this.onGround) { if (inp.moveY > 0) key = map.air; }
    else if (inp.moveY < 0) key = map.up;
    else if (inp.moveY > 0) key = map.down;
    if (!key) return false;
    const info = MOVES[key];
    if (this.chakra < info.cost) return false;   // too little chakra -> falls back to the plain Ninjutsu
    this.chakra -= info.cost;
    this.comboBranchBuffer = null;
    this.setState(key);
    team.storm = Math.min(100, team.storm + 5);
    this.pendingCallout = { text: SIG_NAMES[key], color: this.data.color };
    this['_sig_' + key](opp, team);
    return true;
  }

  _spawnProj(team, o) {
    if (!team.projectiles) team.projectiles = [];
    team.projectiles.push(Object.assign({
      owner: this, kind: 'shuriken', x: this.x, y: this.y - 90, vx: 0, vy: 0, grav: 0,
      damage: CFG.SHURIKEN_DAMAGE, kb: 3, hs: 12, launch: false, hitR: 0, radius: 12,
      lifetime: 90, facing: this.facing, spin: 0, age: 0, hit: false, hitTargets: new Set(),
      anim: null, hitAnim: null, scale: 1, hold: 0, color: this.data.color,
    }, o));
  }

  // Naruto: Rasenshuriken - orb is held during the wind-up (BattleScene releases it), huge launcher
  _sig_rasenshuriken(opp, team) {
    this._spawnProj(team, { kind: 'rasenshuriken', anim: 'rasenshuriken', scale: 0.55,
      hold: MOVES.rasenshuriken.startup, speed: 7.5, x: this.x + this.facing * 50, y: this.y - 120,
      damage: 120, kb: 18, hs: 55, launch: true, hitR: 44, lifetime: 160, color: '#8fdcff' });
  }

  // Naruto: Shadow Clone Barrage - three clones rush in one after another, the last one launches
  _sig_clone_barrage(opp, team) {
    this.queued = { at: MOVES.clone_barrage.startup, fn: (o, t, e) => {
      if (!t.fields) t.fields = [];
      for (let i = 0; i < 3; i++) {
        t.fields.push({ type: 'clone', character: this.character, owner: this, i,
          x: this.x + this.facing * (30 + i * 26), y: CFG.FLOOR_Y, facing: this.facing,
          timer: 0, delay: i * 8, struck: false, strikeT: 0,
          damage: i === 2 ? 34 : 20, kb: i === 2 ? 12 : 6, hs: i === 2 ? 40 : 18, launch: i === 2 });
      }
      e.spawnSmoke(this.x + this.facing * 60, this.y - 70, 12);
    } };
  }

  // Naruto (air): Uzumaki Barrage - diving multi-hit kick
  _sig_rendan(opp, team) {
    this.vx = this.facing * 8;
    this.vy = 8;
    this.onGround = false;
  }

  // Sasuke: Great Fireball Jutsu
  _sig_fireball(opp, team) {
    this.queued = { at: MOVES.fireball.startup, fn: (o, t, e) => {
      this._spawnProj(t, { kind: 'fireball', anim: 'fireball', hitAnim: 'fireball_hit', scale: 0.9,
        x: this.x + this.facing * 70, y: this.y - 105, vx: this.facing * 9,
        damage: 75, kb: 15, hs: 36, hitR: 34, lifetime: 110, color: '#ff8c28' });
      e.spawnBurst(this.x + this.facing * 60, this.y - 105, '#ff9a30', 14, 5, 18, 3, -0.02);
      e.shakeScreen(3);
    } };
  }

  // Sasuke: Kirin - lightning strike on the opponent's position (telegraphed, can be dodged)
  _sig_kirin(opp, team) {
    if (!team.fields) team.fields = [];
    team.fields.push({ type: 'bolt', owner: this, timer: 0, lockAt: 24, strikeAt: 38, struck: false, struckAt: 0,
      x: opp ? opp.x : this.x + this.facing * 300, damage: 110 });
  }

  // Sasuke (air): Phoenix Flower - three small fireballs thrown in a spread
  _sig_phoenix(opp, team) {
    this.queued = { at: MOVES.phoenix.startup, fn: (o, t, e) => {
      const vxs = [11, 9.5, 8], vys = [1.5, 4.5, 7.5];
      for (let i = 0; i < 3; i++) {
        this._spawnProj(t, { kind: 'phoenix', anim: 'fireball', hitAnim: 'fireball_hit', scale: 0.4, small: true,
          x: this.x + this.facing * 50, y: this.y - 90, vx: this.facing * vxs[i], vy: vys[i], grav: 0.12,
          damage: 26, kb: 9, hs: 22, hitR: 16, lifetime: 90, color: '#ff8c28' });
      }
      e.spawnBurst(this.x + this.facing * 50, this.y - 90, '#ff9a30', 10, 4, 16, 3, -0.02);
    } };
  }

  _doChakraDash(opp) {
    let dx;
    if (opp && !opp.defeated) dx = opp.x - this.x;
    else dx = this.facing * 600;
    const sign = dx >= 0 ? 1 : -1;
    this.facing = sign;
    this.vx = sign * 22;
    if (!this.onGround && opp) {
      const dy = opp.y - this.y;
      this.vy = Math.max(-12, Math.min(12, dy * 0.2));
    }
    this.setState(ST.CHAKRA_DASH);
    this.invuln = Math.max(this.invuln, 4);
  }

  _throwShuriken(team) {
    // Create a projectile entity stored on the team for the battle scene to process
    this._spawnProj(team, {
      x: this.x + this.facing * 40, y: this.y - 90,
      vx: this.facing * CFG.SHURIKEN_SPEED, damage: CFG.SHURIKEN_DAMAGE, lifetime: 90, radius: 12,
    });
  }

  _callAssist(team, opp) {
    // Call a support fighter to appear and attack
    if (!team.assists) team.assists = [];
    // Pick a support fighter (not the current leader)
    const supportIdx = (team.leaderIndex + 1) % team.fighters.length;
    const support = team.fighters[supportIdx];
    let ax = this.x + this.facing * 120;
    if (opp && !opp.defeated) {
      // Appear behind the opponent
      ax = opp.x - opp.facing * 80;
    }
    team.assists.push({
      character: support.character,
      x: ax,
      y: CFG.FLOOR_Y,
      facing: opp ? (opp.x > ax ? 1 : -1) : this.facing,
      timer: 0,
      maxTimer: 30,
      attacked: false,
      owner: this,
      hitTargets: new Set(),
    });
  }

  _doSubstitution(team, opp) {
    team.subs -= 1;
    team.subRegenTimers.push(0);
    if (opp && !opp.defeated) {
      // Appear behind the opponent and face them (they face away from us, so we face the way they face)
      this.x = opp.x - opp.facing * 70;
      this.facing = opp.facing;
    } else {
      this.x += -this.facing * 100;
    }
    if (opp) this.y = opp.y;
    this.vx = 0; this.vy = 0;
    if (opp && opp.onGround) this.onGround = true;
    this.hitstun = 0;
    this.invuln = CFG.SUB_I_FRAMES;
    this.setState(ST.SUB);
  }

  _tryCounter(opp, enemyTeam) {
    if (!opp || opp.defeated) return;
    if (Math.abs(opp.x - this.x) < 120) {
      const atkStates = [ST.ATTACK1, ST.ATTACK2, ST.ATTACK_UP, ST.ATTACK_DN, ST.AIR_ATK, ST.TILT, ST.GRAB, ST.NINJUTSU];
      if (atkStates.includes(opp.state)) {
        opp.chakra = Math.max(0, opp.chakra - 30);
        opp.hitstun = CFG.HITSTUN_HEAVY;
        opp.setState(ST.HIT);
        opp.vx = -opp.facing * 6;
        opp.comboCount = 0;
        enemyTeam.damage(CFG.DMG_COUNTER);
      }
    }
  }

  _canAwaken(team) {
    if (this.awakened) return false;
    if (team.health / team.maxHealth <= CFG.AWAKEN_HEALTH_THRESHOLD) return true;
    if (team.storm >= 100) return true;
    return false;
  }

  _startAwakening() {
    this.awakened = true;
    this.awakenTimer = CFG.AWAKEN_DURATION;
    this.invuln = Math.max(this.invuln, 30);
    this.chakra = CFG.MAX_CHAKRA;
  }

  update(opp, team, effects) {
    if (this.defeated) {
      // Knocked-out fighter: keep animating and let them fall to the floor instead of freezing mid-air
      this.state = ST.DEFEATED;
      this.hitstun = 0;
      this.animTimer++;
      if (this.animTimer >= Math.max(1, Math.floor(60 / (ANIM_FPS.defeated || 4)))) {
        this.animTimer = 0;
        const len = this.assets.getAnimLength(this.character, ST.DEFEATED);
        if (this.animFrame < len - 1) this.animFrame++;
      }
      this.vy += CFG.GRAVITY;
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.9;
      this.x = Math.max(CFG.LEFT_WALL + 30, Math.min(CFG.RIGHT_WALL - 30, this.x));
      if (this.y >= CFG.FLOOR_Y) { this.y = CFG.FLOOR_Y; this.vy = 0; this.onGround = true; }
      return;
    }
    if (this.cinematicFreeze > 0) { this.cinematicFreeze--; return; }

    if (this.invuln > 0) this.invuln--;
    if (this.perfectWindow > 0) this.perfectWindow--;
    if (this.perfectFlash > 0) this.perfectFlash--;
    if (this.blockFlash > 0) this.blockFlash--;
    if (this.guardBreak > 0) this.guardBreak--;
    if (this.hitstun > 0) {
      this.hitstun--;
      if (this.state !== ST.HIT) this.setState(ST.HIT);
      if (this.hitstun === 0) {
        this.comboCount = 0;
        this.setState(this.onGround ? ST.IDLE : ST.FALL);
      }
    }

    if (this.awakened) {
      this.awakenTimer--;
      if (this.awakenTimer <= 0) this.awakened = false;
      else if (Math.random() < 0.5) effects.spawnAwakenAura(this.x, this.y - 80, this.data.color);
    }

    if (this.chakraLoadHeld && this.canAct() && !this.blocking) {
      const rate = CFG.CHAKRA_LOAD_RATE * (this.awakened ? CFG.AWAKEN_CHAKRA_BOOST : 1);
      this.chakra = Math.min(CFG.MAX_CHAKRA, this.chakra + rate);
    } else {
      const regen = CFG.CHAKRA_REGEN * (this.awakened ? CFG.AWAKEN_CHAKRA_BOOST : 1);
      this.chakra = Math.min(CFG.MAX_CHAKRA, this.chakra + regen);
    }

    this.stateTimer++;
    this.animTimer++;
    // Deferred spawn of a signature move (cancelled by setState when the fighter is hit)
    if (this.queued && this.stateTimer >= this.queued.at) {
      const q = this.queued; this.queued = null;
      q.fn(opp, team, effects);
    }
    // Multi-hit moves (Uzumaki Barrage) re-open their hitbox every few frames
    const mv = MOVES[this.state];
    if (mv && mv.multi && this.stateTimer > mv.startup && (this.stateTimer - mv.startup) % mv.multi === 0) {
      this._lastHitTargets.clear();
    }
    const fps = ANIM_FPS[this.state] || 10;
    if (this.animTimer >= Math.max(1, Math.floor(60 / fps))) {
      this.animTimer = 0;
      const animLen = this.assets.getAnimLength(this.character, this.state);
      // Looping states: idle, walk, jump, fall, block, hit, defeated, intro
      // Action states: attack1, attack2, attack_up, attack_dn, air_atk, tilt, grab,
      //   ninjutsu, ultimate, linked, chakra_dash, sub — play once, hold last frame
      const loopingStates = [ST.IDLE, ST.WALK, ST.JUMP, ST.FALL, ST.BLOCK, ST.HIT, ST.DEFEATED, ST.INTRO];
      if (loopingStates.includes(this.state)) {
        this.animFrame = (this.animFrame + 1) % Math.max(1, animLen);
      } else if (this.animFrame < animLen - 1) {
        this.animFrame++;
      }
      // else: hold on last frame for action states
    }

    const info = MOVES[this.state];
    if (info) {
      const total = info.startup + info.active + info.recovery;
      if (this.comboBranchBuffer && this.stateTimer >= info.startup + info.active) {
        if (this.stateTimer >= total - 4) {
          const nxt = this.comboBranchBuffer;
          this.comboBranchBuffer = null;
          this.comboCount++;
          if (nxt === ST.ATTACK2 && this.comboCount >= 2) this.comboCount = 0;
          this.setState(nxt);
          return;
        }
      }
      if (this.stateTimer >= total) {
        if ([ST.ATTACK1, ST.ATTACK2, ST.ATTACK_UP, ST.ATTACK_DN, ST.AIR_ATK].includes(this.state)) {
          this.comboCount = 0;
        }
        if ([ST.ULTIMATE, ST.LINKED].includes(this.state)) {
          this.invuln = Math.max(this.invuln, 12);
        }
        // The chakra dash's slow-down was in a branch that could never run (the move ends at 8
        // frames, the check was for 14), so an air dash kept flying at 22px/frame forever.
        if (this.state === ST.CHAKRA_DASH) this.vx *= 0.3;
        this.setState(this.onGround ? ST.IDLE : ST.FALL);
      }
    }

    if (this.state === ST.SUB && this.stateTimer >= 12) {
      this.setState(this.onGround ? ST.IDLE : ST.FALL);
    }
    if (this.state === ST.BLOCK && !this.blocking) {
      this.setState(ST.IDLE);
    }
    // Guard only exists while in the block / blockstun states. (It used to stay "on" during
    // whole ninjutsu / ultimate animations if you started one out of a guard.)
    if (this.state !== ST.BLOCK && this.state !== ST.HIT) this.blocking = false;
    // Guard gauge: refills when not guarding (slowly while guarding), and recovers fully from a break
    if (this.guardBreak === 0) {
      this.guard = Math.min(100, this.guard + (this.blocking ? 0.1 : 0.5));
    }

    // Air momentum: air dashes used to carry at 14px/frame all the way to the wall
    if (!this.onGround && this.hitstun === 0 && Math.abs(this.vx) > CFG.RUN_SPEED) {
      this.vx *= 0.9;
    }

    // Physics
    this.onWall = false;
    if (!this.onGround) {
      if (this.x <= CFG.LEFT_WALL + 20) { this.onWall = true; this.wallSide = -1; }
      else if (this.x >= CFG.RIGHT_WALL - 20) { this.onWall = true; this.wallSide = 1; }
    }
    if (this.onWall && this.vy > 0) this.vy = Math.min(this.vy, CFG.WALL_SLIDE_VY);
    if (!this.onWall) this.vy += CFG.GRAVITY;
    else this.vy += CFG.GRAVITY * 0.5;

    this.x += this.vx;
    this.y += this.vy;

    if (this.x < CFG.LEFT_WALL + 30) {
      this.x = CFG.LEFT_WALL + 30;
      this.vx = 0;
      if (!this.onGround) { this.onWall = true; this.wallSide = -1; }
    } else if (this.x > CFG.RIGHT_WALL - 30) {
      this.x = CFG.RIGHT_WALL - 30;
      this.vx = 0;
      if (!this.onGround) { this.onWall = true; this.wallSide = 1; }
    }

    if (this.y >= CFG.FLOOR_Y) {
      this.y = CFG.FLOOR_Y;
      this.vy = 0;
      if (!this.onGround) {
        effects.spawnDust(this.x, this.y, 10);
        effects.shakeScreen(2);
      }
      this.onGround = true;
      this.onWall = false;
      if ([ST.JUMP, ST.FALL, ST.AIR_ATK, ST.CHAKRA_DASH, ST.RENDAN].includes(this.state)) {
        this.setState(ST.IDLE);
      }
    } else {
      this.onGround = false;
      if (this.vy > 0 && this.state === ST.JUMP) {
        this.state = ST.FALL;
        this.animFrame = 0; this.animTimer = 0;
      }
    }

    if (this.y < CFG.CEILING_Y + 30) {
      this.y = CFG.CEILING_Y + 30;
      if (this.vy < 0) this.vy = 0;
    }

    if (this.onGround && ![ST.WALK, ST.ATTACK1, ST.ATTACK2].includes(this.state)) {
      this.vx *= 0.7;
      if (Math.abs(this.vx) < 0.1) this.vx = 0;
    }

    if (this.hitstun === 0 && this.state === ST.HIT && this.onGround) {
      this.setState(ST.IDLE);
    }
  }

  takeHit(attacker, info, damage, knockback, hitstun, team, effects, opts = {}) {
    if (this.defeated) return false;
    if (this.invuln > 0) return false;
    const { launch = false, slam = false, grab = false, ignoreBlock = false } = opts;
    // Push away from the attacker (not "opposite of my facing", which is wrong whenever
    // the defender isn't facing the attacker, e.g. after a substitution or a cross-up)
    const awayDir = this.x >= attacker.x ? 1 : -1;
    // Hit spark position on the side the attack came from
    const towardAtk = -awayDir;

    // Directional blocking: melee attacks from behind (cross-ups after a substitution / swap)
    // cannot be blocked. Projectiles and assists are always blockable.
    const frontal = !opts.melee || ((attacker.x - this.x) * this.facing >= 0);
    if (!ignoreBlock && !grab && frontal && this.blocking && this.onGround) {
      // PERFECT BLOCK: Guard tapped just before the hit -> no damage, no guard drain,
      // the melee attacker is staggered and the defender gains chakra + Storm.
      if (this.perfectWindow > 0) {
        this.perfectWindow = 0;
        this.perfectFlash = 20;
        this.vx = awayDir * knockback * 0.15;
        this.chakra = Math.min(CFG.MAX_CHAKRA, this.chakra + 12);
        team.gainStorm(3);
        if (opts.melee && attacker.state !== ST.ULTIMATE && attacker.state !== ST.LINKED) {
          attacker.hitstun = Math.max(attacker.hitstun, 22);
          attacker.comboBranchBuffer = null;
          attacker.setState(ST.HIT);
        }
        effects.spawnBurst(this.x + towardAtk * 30, this.y - 80, '#ffe680', 18, 8, 22, 4, 0.05);
        effects.whiteFlash(0.25);
        effects.shakeScreen(3);
        return false;
      }
      const chip = Math.max(1, Math.floor(damage / 8));
      team.damage(chip);
      this.vx = awayDir * knockback * 0.4;
      this.hitstun = Math.max(this.hitstun, Math.floor(hitstun / 3));
      this.blockFlash = 10;
      effects.spawnBlockSpark(this.x + towardAtk * 30, this.y - 80);
      // Guard gauge drain. Empty gauge (or a massive hit) = GUARD BREAK.
      this.guard -= damage * 0.6;
      if (this.guard <= 0 || damage >= CFG.DMG_ULTIMATE) {
        this.guard = 0;
        this.guardBreak = 120;        // can't guard for 2s
        this.blocking = false;
        this.hitstun = Math.max(this.hitstun, 50);
        this.vx = awayDir * 8;
        this.setState(ST.HIT);
        effects.spawnBurst(this.x, this.y - 80, '#ff6060', 26, 9, 30, 4, 0.15);
        effects.shakeScreen(8);
        effects.whiteFlash(0.3);
      }
      return false;
    }

    const dmg = Math.floor(damage * (attacker.awakened ? CFG.AWAKEN_DAMAGE_BOOST : 1.0));
    team.damage(dmg);
    this.hitstun = Math.max(this.hitstun, hitstun);
    this.comboCount = 0;
    this.comboBranchBuffer = null;   // a buffered combo follow-up must not survive being hit
    this.blocking = false;           // a hit that gets through (e.g. a grab) breaks the guard
    if (launch) { this.vy = -14; this.onGround = false; }
    if (slam) { this.vy = 16; this.onGround = false; }
    this.vx = awayDir * knockback;
    this.setState(ST.HIT);
    const hx = this.x + towardAtk * 20;
    const hy = this.y - 80;
    effects.spawnHitSpark(hx, hy, attacker.data.color);
    effects.shakeScreen(Math.min(8, Math.floor(damage / 8)));
    if (damage >= CFG.DMG_ULTIMATE) effects.whiteFlash(0.5);
    return true;
  }

  draw(ctx, effects) {
    const frame = this.assets.getFrame(this.character, this.state, this.animFrame);
    if (!frame) return;
    const atlas = this.assets.getAtlas(this.character);
    if (!atlas) return;

    // Use foot_y and center_x for proper anchoring: the character's feet
    // are at this.y and the body center is at this.x, regardless of how
    // the sprite rectangle is padded.
    const footY = frame.foot_y != null ? frame.foot_y : frame.src_h;
    const centerX = frame.center_x != null ? frame.center_x : frame.src_w / 2;

    ctx.save();
    if (this.facing === -1) {
      // Flip horizontally around this.x
      ctx.translate(this.x, 0);
      ctx.scale(-1, 1);
      ctx.translate(-this.x, 0);
    }
    // Anchor: center_x maps to this.x, foot_y maps to this.y
    const dx = this.x - centerX;
    const dy = this.y - footY;
    ctx.drawImage(atlas, frame.src_x, frame.src_y, frame.src_w, frame.src_h, dx, dy, frame.src_w, frame.src_h);
    ctx.restore();

    // Rasengan / Chidori orb in the hand during the plain Ninjutsu (frames from the fx2 atlas)
    const orb = HAND_ORBS[this.character];
    if (orb && this.state === ST.NINJUTSU && this.stateTimer < MOVES.ninjutsu.startup + MOVES.ninjutsu.active + 6) {
      const fr = this.assets.getFx(orb.anim, Math.floor(this.stateTimer / 2));
      const fx2 = this.assets.atlases.fx2;
      if (fr && fx2) {
        const w = fr.src_w * orb.scale, h = fr.src_h * orb.scale;
        const ox = this.x + this.facing * orb.dx, oy = this.y - orb.dy;
        ctx.save();
        ctx.globalAlpha = Math.min(1, this.stateTimer / 6);
        ctx.drawImage(fx2, fr.src_x, fr.src_y, fr.src_w, fr.src_h, ox - w / 2, oy - h / 2, w, h);
        ctx.restore();
      }
    }

    // Guard shield (translucent arc in front of a blocking fighter), gold ring on Perfect Block
    if (this.blocking || this.blockFlash > 0 || this.perfectFlash > 0) {
      ctx.save();
      const cx = this.x + this.facing * 34, cy = this.y - 80;
      const lowGuard = this.guard < 30;
      ctx.globalAlpha = (this.perfectFlash > 0 ? 0.35 + this.perfectFlash / 40 : (this.blockFlash > 0 ? 0.55 : 0.22));
      ctx.fillStyle = this.perfectFlash > 0 ? '#ffe680' : (lowGuard ? '#ff8080' : '#8cdcff');
      ctx.beginPath();
      ctx.ellipse(cx, cy, 34, 66, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = this.perfectFlash > 0 ? '#fff6c0' : '#d8f0ff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    if (this.guardBreak > 0 && Math.floor(this.guardBreak / 6) % 2 === 0) {
      ctx.save();
      ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ff6060';
      ctx.fillText('GUARD BREAK', this.x, this.y - 160);
      ctx.restore();
    }

    // Awakened aura ring
    if (this.awakened) {
      const r = 60 + Math.floor(10 * Math.sin(performance.now() * 0.01));
      ctx.save();
      ctx.strokeStyle = this.data.color;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y - 90, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ============================================================================
// TEAM
// ============================================================================
class Team {
  constructor(teamId, characterList, startX, facing, assets) {
    this.teamId = teamId;
    this.characterList = characterList;
    this.fighters = characterList.map(c => new Fighter(c, startX, CFG.FLOOR_Y, facing, teamId, assets));
    this.leaderIndex = 0;
    this.maxHealth = CFG.MAX_HEALTH;
    this.health = CFG.MAX_HEALTH;
    this._displayedHealth = CFG.MAX_HEALTH;
    this.storm = 0;
    this._displayedStorm = 0;
    this.subs = CFG.MAX_SUBSTITUTION;
    this.subRegenTimers = [];
    this.swapFlashTimer = 0;
    this.projectiles = []; // Shuriken projectiles thrown by team members
    this.assists = [];     // Support fighter assist calls
    this.fields = [];      // Signature-move entities: shadow clones, Kirin bolts
    this.swapCooldown = 0; // frames until the leader can be changed again
  }

  get leader() { return this.fighters[this.leaderIndex]; }

  swapLeader(direction, oppTeam) {
    if (this.fighters.length <= 1) return false;
    // Without a cooldown, tapping Q/E repeatedly filled the whole Storm gauge for free
    if (this.swapCooldown > 0) return false;
    const old = this.leader;
    const newIdx = (this.leaderIndex + direction + this.fighters.length) % this.fighters.length;
    if (newIdx === this.leaderIndex) return false;
    const newLeader = this.fighters[newIdx];
    newLeader.x = old.x; newLeader.y = old.y;
    newLeader.vx = 0; newLeader.vy = 0;
    newLeader.onGround = old.onGround; newLeader.onWall = old.onWall;
    newLeader.facing = old.facing;
    newLeader.setState(ST.IDLE);
    newLeader.comboCount = 0; newLeader.hitstun = 0; newLeader.invuln = 18;
    newLeader.comboBranchBuffer = null; newLeader.blocking = false; newLeader.flipLock = false;
    newLeader.cinematicFreeze = 0; newLeader.airDashUsed = false;
    newLeader.chakra = Math.max(newLeader.chakra, 30);
    old.x = -200; old.y = CFG.FLOOR_Y; old.vx = 0; old.vy = 0;
    old.hitstun = 0; old.comboBranchBuffer = null;
    this.leaderIndex = newIdx;
    this.storm = Math.min(100, this.storm + CFG.STORM_PER_SWITCH);
    this.swapFlashTimer = 12;
    this.swapCooldown = 90;
    return true;
  }

  damage(amount) {
    this.health = Math.max(0, this.health - amount);
    this.storm = Math.min(100, this.storm + CFG.STORM_PER_HIT);
  }

  gainStorm(amount) { this.storm = Math.min(100, this.storm + amount); }

  updateSubs(dt) {
    if (this.subRegenTimers.length === 0) return;
    this.subRegenTimers = this.subRegenTimers.map(t => t + dt);
    const ready = this.subRegenTimers.filter(t => t >= 4.0);
    if (ready.length > 0) {
      for (let i = 0; i < ready.length; i++) {
        if (this.subs < CFG.MAX_SUBSTITUTION) this.subs++;
      }
      this.subRegenTimers = this.subRegenTimers.filter(t => t < 4.0);
    }
  }

  updateDisplayed() {
    if (this._displayedHealth > this.health) {
      this._displayedHealth = Math.max(this.health, this._displayedHealth - 4);
    } else {
      this._displayedHealth = this.health;
    }
    if (Math.abs(this._displayedStorm - this.storm) > 0.5) {
      this._displayedStorm += (this.storm - this._displayedStorm) * 0.2;
    } else {
      this._displayedStorm = this.storm;
    }
  }

  isDefeated() { return this.health <= 0; }
}

// ============================================================================
// EFFECTS
// ============================================================================
class EffectManager {
  constructor() {
    this.particles = [];
    this.sprites = [];
    this.texts = [];   // floating move-name callouts
    this.shake = 0;
    this.flash = 0;
    this.cinematic = false;
    this.cinematicTimer = 0;
    this.cinematicMax = 0;
    this.cinematicText = '';
    this.cinematicColor = '#ffdc50';
  }

  spawnBurst(x, y, color, count = 14, speed = 6, life = 24, size = 3, gravity = 0.1) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = speed * (0.3 + Math.random() * 0.7);
      this.particles.push({
        x, y,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: Math.floor(life * (0.7 + Math.random() * 0.5)),
        maxLife: life, color, size, gravity,
      });
    }
  }

  spawnHitSpark(x, y, color = '#ffdc50') {
    this.spawnBurst(x, y, color, 22, 10, 28, 5, 0.15);
    this.spawnBurst(x, y, '#ffffff', 8, 12, 16, 3, 0.1);
    // Add a brief flash particle at the impact point
    this.particles.push({
      x, y, vx: 0, vy: 0, life: 8, maxLife: 8,
      color: '#ffffff', size: 20, gravity: 0,
    });
  }

  spawnBlockSpark(x, y) {
    this.spawnBurst(x, y, '#b4dcff', 10, 5, 18, 2, 0.1);
  }

  spawnSmoke(x, y, count = 10) {
    for (let i = 0; i < count; i++) {
      this.particles.push({
        x: x + (Math.random() - 0.5) * 24,
        y: y + (Math.random() - 0.5) * 16,
        vx: (Math.random() - 0.5) * 4,
        vy: -Math.random() * 3 - 0.5,
        life: 28 + Math.floor(Math.random() * 16),
        maxLife: 44, color: '#b4b4be', size: 6 + Math.floor(Math.random() * 5),
        gravity: -0.05,
      });
    }
  }

  spawnDust(x, y, count = 8) {
    for (let i = 0; i < count; i++) {
      this.particles.push({
        x: x + (Math.random() - 0.5) * 16,
        y: y,
        vx: (Math.random() - 0.5) * 6,
        vy: -Math.random() * 3 - 1,
        life: 18 + Math.floor(Math.random() * 10),
        maxLife: 28, color: '#c8b496', size: 3 + Math.floor(Math.random() * 4),
        gravity: 0.2,
      });
    }
  }

  spawnAwakenAura(x, y, color) {
    for (let i = 0; i < 2; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = 20 + Math.random() * 30;
      this.particles.push({
        x: x + Math.cos(ang) * r,
        y: y + Math.sin(ang) * r * 0.6 + 30,
        vx: -Math.cos(ang),
        vy: -Math.sin(ang) * 1.5 - 1,
        life: 20 + Math.floor(Math.random() * 10),
        maxLife: 30, color, size: 3 + Math.floor(Math.random() * 3),
        gravity: -0.02,
      });
    }
  }

  // atlasName: which atlas the frames come from ('fx' or 'fx2'); scale: number or [sx, sy]
  addSpriteEffect(surfaces, x, y, fps = 24, anchor = 'center', atlasName = 'fx', scale = 1) {
    this.sprites.push({
      surfaces, x, y, frame: 0, timer: 0, fps, anchor, atlasName, scale,
    });
  }

  addText(x, y, text, color = '#ffffff', life = 56) {
    this.texts.push({ x, y, text, color, life, maxLife: life });
  }

  shakeScreen(amount) { this.shake = Math.max(this.shake, amount); }
  whiteFlash(amount = 0.6) { this.flash = Math.max(this.flash, amount); }

  triggerCinematic(text, duration = 120, color = '#ffdc50') {
    this.cinematic = true;
    this.cinematicTimer = duration;
    this.cinematicMax = duration;
    this.cinematicText = text;
    this.cinematicColor = color;
  }

  update() {
    for (const p of this.particles) {
      p.x += p.vx; p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life--;
    }
    this.particles = this.particles.filter(p => p.life > 0);
    for (const t of this.texts) { t.life--; t.y -= 0.5; }
    this.texts = this.texts.filter(t => t.life > 0);

    this.sprites = this.sprites.filter(sp => {
      sp.timer++;
      const frameLen = Math.max(1, Math.floor(60 / sp.fps));
      if (sp.timer >= frameLen) {
        sp.timer = 0;
        sp.frame++;
        if (sp.frame >= sp.surfaces.length) return false;
      }
      return true;
    });

    this.shake *= 0.85;
    if (this.shake < 0.1) this.shake = 0;
    this.flash *= 0.85;
    if (this.flash < 0.02) this.flash = 0;
    if (this.cinematic) {
      this.cinematicTimer--;
      if (this.cinematicTimer <= 0) this.cinematic = false;
    }
  }

  drawParticles(ctx) {
    for (const p of this.particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Move-name callouts
    for (const t of this.texts) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, t.life / (t.maxLife * 0.4));
      ctx.font = 'bold 24px "Trebuchet MS", Arial';
      ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = '#000';
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    }
  }

  drawSprites(ctx, assets) {
    for (const sp of this.sprites) {
      if (sp.frame >= sp.surfaces.length) continue;
      const meta = sp.surfaces[sp.frame];
      const atlas = assets.atlases[sp.atlasName || 'fx'];
      if (!atlas) continue;
      const sx = Array.isArray(sp.scale) ? sp.scale[0] : (sp.scale || 1);
      const sy = Array.isArray(sp.scale) ? sp.scale[1] : (sp.scale || 1);
      const w = meta.src_w * sx, h = meta.src_h * sy;
      let dx, dy;
      if (sp.anchor === 'center') {
        dx = sp.x - w / 2;
        dy = sp.y - h / 2;
      } else {
        dx = sp.x; dy = sp.y;
      }
      ctx.drawImage(atlas, meta.src_x, meta.src_y, meta.src_w, meta.src_h, dx, dy, w, h);
    }
  }

  drawOverlay(ctx) {
    if (this.cinematic) {
      const barH = 110;
      const progress = 1 - this.cinematicTimer / this.cinematicMax;
      const ease = Math.min(1, progress * 4);
      const curH = Math.floor(barH * ease);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CFG.SCREEN_W, curH);
      ctx.fillRect(0, CFG.SCREEN_H - curH, CFG.SCREEN_W, curH);
      if (ease >= 1 && this.cinematicTimer > 10) {
        ctx.save();
        ctx.font = 'bold 56px "Trebuchet MS", Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const lines = this.cinematicText.split('\n');
        const yStart = CFG.SCREEN_H / 2 - (lines.length - 1) * 32;
        lines.forEach((line, i) => {
          ctx.fillStyle = '#000';
          ctx.fillText(line, CFG.SCREEN_W / 2 + 3, yStart + i * 64 + 3);
          ctx.fillStyle = this.cinematicColor;
          ctx.fillText(line, CFG.SCREEN_W / 2, yStart + i * 64);
        });
        ctx.restore();
      }
    }
    if (this.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${this.flash})`;
      ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);
    }
  }

  getShakeOffset() {
    if (this.shake <= 0) return [0, 0];
    return [
      (Math.random() - 0.5) * 2 * Math.floor(this.shake),
      (Math.random() - 0.5) * 2 * Math.floor(this.shake),
    ];
  }
}

class HUD {
  constructor(team, side) {
    this.team = team;
    this.side = side;
  }

  draw(ctx, fonts) {
    const t = this.team;
    const barW = 460, barH = 22;
    let x, y, portraitX;
    if (this.side === 'left') {
      x = 30; y = 30; portraitX = x + barW + 12;
    } else {
      x = CFG.SCREEN_W - 30 - barW; y = 30; portraitX = x - 12 - 64;
    }

    // Health bar bg
    ctx.fillStyle = COLORS.HEALTH_BACK;
    ctx.fillRect(x, y, barW, barH);

    const dispRatio = Math.max(0, t._displayedHealth) / CFG.MAX_HEALTH;
    const realRatio = Math.max(0, t.health) / CFG.MAX_HEALTH;
    ctx.fillStyle = COLORS.HEALTH_TRAIL;
    if (this.side === 'left') ctx.fillRect(x, y, barW * dispRatio, barH);
    else ctx.fillRect(x + barW - barW * dispRatio, y, barW * dispRatio, barH);
    ctx.fillStyle = COLORS.HEALTH;
    if (this.side === 'left') ctx.fillRect(x, y, barW * realRatio, barH);
    else ctx.fillRect(x + barW - barW * realRatio, y, barW * realRatio, barH);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, barW, barH);

    ctx.font = fonts.small;
    ctx.fillStyle = COLORS.TEXT;
    const hpTxt = `${Math.floor(t.health)} / ${CFG.MAX_HEALTH}`;
    if (this.side === 'left') { ctx.textAlign = 'left'; ctx.fillText(hpTxt, x + 6, y + 15); }
    else { ctx.textAlign = 'right'; ctx.fillText(hpTxt, x + barW - 6, y + 15); }

    // Chakra gauge
    const chY = y + barH + 4;
    ctx.fillStyle = COLORS.CHAKRA_BACK;
    ctx.fillRect(x, chY, barW, 8);
    const chRatio = t.leader.chakra / CFG.MAX_CHAKRA;
    ctx.fillStyle = COLORS.CHAKRA;
    if (this.side === 'left') ctx.fillRect(x, chY, barW * chRatio, 8);
    else ctx.fillRect(x + barW - barW * chRatio, chY, barW * chRatio, 8);
    ctx.strokeRect(x, chY, barW, 8);

    // Storm gauge (vertical bar)
    const stormX = this.side === 'left' ? x - 18 : x + barW + 10;
    const stormY = y;
    const stormH = barH + 12;
    ctx.fillStyle = '#28140a';
    ctx.fillRect(stormX, stormY, 8, stormH);
    const sh = Math.floor(stormH * (t._displayedStorm / CFG.MAX_STORM));
    ctx.fillStyle = COLORS.STORM;
    ctx.fillRect(stormX, stormY + stormH - sh, 8, sh);
    ctx.strokeRect(stormX, stormY, 8, stormH);
    if (t.storm >= CFG.MAX_STORM) {
      ctx.save();
      const alpha = 0.5 + 0.3 * Math.sin(performance.now() * 0.01);
      ctx.strokeStyle = `rgba(255, 200, 80, ${alpha})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(stormX - 4, stormY - 2, 16, stormH + 4);
      ctx.restore();
    }

    // Substitution pips
    const subY = chY + 14;
    for (let i = 0; i < CFG.MAX_SUBSTITUTION; i++) {
      const sx = this.side === 'left' ? x + i * 16 : x + barW - (i + 1) * 16;
      ctx.fillStyle = i < t.subs ? COLORS.SUB : '#322814';
      ctx.fillRect(sx, subY, 12, 6);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(sx, subY, 12, 6);
    }

    // Guard gauge (green; red when low / broken), next to the substitution pips
    {
      const gw = 110, gh = 6;
      const gx = this.side === 'left' ? x + 76 : x + barW - 76 - gw;
      const gr = Math.max(0, t.leader.guard) / 100;
      ctx.fillStyle = '#0c2814';
      ctx.fillRect(gx, subY, gw, gh);
      ctx.fillStyle = (t.leader.guardBreak > 0 || gr < 0.3) ? '#ff5050' : '#5aff8c';
      if (this.side === 'left') ctx.fillRect(gx, subY, gw * gr, gh);
      else ctx.fillRect(gx + gw - gw * gr, subY, gw * gr, gh);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
      ctx.strokeRect(gx, subY, gw, gh);
      ctx.font = '10px Arial'; ctx.fillStyle = COLORS.TEXT_DIM;
      ctx.textAlign = this.side === 'left' ? 'left' : 'right';
      ctx.fillText('GUARD', this.side === 'left' ? gx : gx + gw, subY + 16);
    }

    // Portrait
    const leader = t.leader;
    const frame = leader.assets.getFrame(leader.character, 'idle', 0);
    const atlas = leader.assets.getAtlas(leader.character);
    if (frame && atlas) {
      const ratio = 64 / Math.max(frame.src_w, frame.src_h);
      const pw = frame.src_w * ratio;
      const ph = frame.src_h * ratio;
      const px = this.side === 'left' ? portraitX : portraitX + 64 - pw;
      ctx.drawImage(atlas, frame.src_x, frame.src_y, frame.src_w, frame.src_h, px, y - 4, pw, ph);
    }

    // Name
    ctx.font = fonts.med;
    ctx.fillStyle = COLORS.TEXT;
    if (this.side === 'left') { ctx.textAlign = 'left'; ctx.fillText(leader.data.display, portraitX, y + 80); }
    else { ctx.textAlign = 'right'; ctx.fillText(leader.data.display, portraitX + 64, y + 80); }

    // Team roster pips
    for (let i = 0; i < t.fighters.length; i++) {
      const f = t.fighters[i];
      const dotY = y + 96;
      const dotX = this.side === 'left' ? portraitX + i * 18 + 6 : portraitX + 64 - (i + 1) * 18 + 6;
      ctx.fillStyle = f.data.color;
      ctx.beginPath();
      ctx.arc(dotX, dotY, i === t.leaderIndex ? 8 : 6, 0, Math.PI * 2);
      ctx.fill();
      if (i === t.leaderIndex) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // Awakening indicator
    if (leader.awakened) {
      ctx.font = fonts.small;
      ctx.fillStyle = COLORS.ACCENT;
      ctx.textAlign = 'left';
      ctx.fillText(`AWAKENING ${Math.floor(leader.awakenTimer / 60)}s`, x, subY + 18);
    }
  }
}

class ComboCounter {
  constructor(side) {
    this.side = side; this.combo = 0; this.damage = 0; this.timer = 0;
  }
  registerHit(damage) {
    this.combo++;
    this.damage += damage;
    this.timer = 90;
  }
  update() {
    if (this.timer > 0) {
      this.timer--;
      if (this.timer === 0) { this.combo = 0; this.damage = 0; }
    }
  }
  draw(ctx, fonts) {
    if (this.combo < 2) return;
    const alpha = this.timer < 30 ? this.timer / 30 : 1;
    const x = this.side === 'left' ? CFG.SCREEN_W - 200 : 60;
    const y = CFG.SCREEN_H / 2 - 40;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = fonts.big;
    ctx.fillStyle = COLORS.ACCENT;
    ctx.textAlign = 'left';
    ctx.fillText(String(this.combo), x, y + 40);
    ctx.font = fonts.med;
    ctx.fillStyle = COLORS.TEXT;
    ctx.fillText('COMBO', x, y + 70);
    ctx.fillStyle = '#ffc8c8';
    ctx.fillText(`${this.damage} DMG`, x, y + 92);
    ctx.restore();
  }
}

// ============================================================================
// CPU AI
// ============================================================================
class CpuBrain {
  constructor() {
    this.ultimateStep = 0;
    this.ultimateTimer = 0;
  }

  update(cpu, cpuTeam, opp, oppTeam) {
    const inp = new InputState();
    if (!cpu || cpu.defeated || !opp) return inp;
    // Training-mode dummy behaviours
    if (this.mode === 'stand') return inp;
    if (this.mode === 'guard') { inp.guardHeld = true; return inp; }

    if (this.ultimateTimer > 0) this.ultimateTimer--;
    if (this.ultimateTimer === 0) this.ultimateStep = 0;

    const dx = opp.x - cpu.x;
    const adx = Math.abs(dx);
    const face = dx >= 0 ? 1 : -1;

    if (cpu.hitstun > 8 && cpuTeam.subs > 0 && Math.random() < 0.08) {
      inp.subPressed = true; return inp;
    }
    const atkStates = ['attack1','attack2','attack_up','attack_dn','air_atk','tilt','ninjutsu'];
    if (atkStates.includes(opp.state) && adx < 130 && Math.random() < 0.6) {
      inp.guardHeld = true;
      inp.guardPressed = Math.random() < 0.08;   // occasionally a perfect block
      return inp;
    }

    // NOTE: Fighter.applyInput reads the *derived* flags (ninjutsu / ultimate / linkedSecret /
    // chakraDash / grab), which InputMapper normally computes from raw key presses. The CPU
    // never goes through InputMapper, so it has to set those flags directly. (Before, it only
    // set raw chakraHeld+attackPressed, which just produced a plain attack - the CPU could
    // never actually use ninjutsu, ultimates, linked secret, chakra dash or grabs.)
    if (cpuTeam.storm >= 100 && cpu.chakra >= 30 && adx < 200 && Math.random() < 0.04) {
      inp.chakraHeld = true; inp.linkedSecret = true; return inp;
    }
    if (cpu.chakra >= 75 && adx < 200 && !opp.blocking && Math.random() < 0.015) {
      inp.chakraHeld = true; inp.ultimate = true; return inp;
    }
    if (cpu.chakra >= 40 && adx > 100 && adx < 300 && Math.random() < 0.03) {
      inp.chakraHeld = true; inp.ninjutsu = true;
      // Naruto / Sasuke mix in their signature moves (Fighter falls back to plain Ninjutsu if chakra is short)
      if (SIGNATURES[cpu.character] && Math.random() < 0.65) {
        inp.moveY = cpu.onGround ? (Math.random() < 0.5 ? -1 : 1) : 1;
      }
      return inp;
    }
    // CPU throws shuriken at mid-range
    if (cpu.chakra >= CFG.SHURIKEN_COST && adx > 150 && adx < 400 && Math.random() < 0.02) {
      inp.shuriken = true; return inp;
    }
    // CPU calls assist when storm is available
    if (cpuTeam.storm >= CFG.ASSIST_STORM_COST && adx > 80 && adx < 250 && Math.random() < 0.015) {
      inp.assist = true; return inp;
    }
    if (cpu.chakra >= 25 && adx > 250 && Math.random() < 0.04) {
      inp.chakraHeld = true; inp.chakraDash = true; return inp;
    }
    if (cpuTeam.storm < 30 && cpu.chakra < 20 && Math.random() < 0.005) {
      inp.changeLeaderNext = true; return inp;
    }
    if (!cpu.awakened && cpuTeam.health / cpuTeam.maxHealth < 0.3 && cpu.chakra > 50 && Math.random() < 0.05) {
      inp.chakraHeld = true; return inp;
    }

    if (cpu.canAct()) {
      if (adx > 110) inp.moveX = face;
      else if (adx < 90) inp.moveX = -face;   // 85 is the minimum possible distance, so 80 never triggered
      // Only attack when in range but not too close
      // Use difficulty multiplier (defaults to 0.045 for non-story battles)
      const atkChance = this._difficulty || 0.045;
      if (adx < 130 && adx > 80 && Math.random() < atkChance) {
        inp.attackPressed = true;
        const r = Math.random();
        if (r < 0.2) inp.moveY = -1;
        else if (r < 0.4) inp.moveY = 1;
        return inp;
      }
      if (adx > 200 && Math.random() < 0.02) { inp.jumpPressed = true; return inp; }
      // (fighters can't get closer than ~85px, so the old `adx < 80` test could never be true)
      if (opp.blocking && adx < 110 && Math.random() < 0.04) {
        inp.guardHeld = true; inp.grab = true; return inp;
      }
    } else {
      if (cpu.chakra < 50 && Math.random() < 0.5) inp.chakraHeld = true;
    }
    return inp;
  }
}

// ============================================================================
// BACKGROUND
// ============================================================================
function makeBackground(ctx) {
  const bg = document.createElement('canvas');
  bg.width = CFG.SCREEN_W; bg.height = CFG.SCREEN_H;
  const bctx = bg.getContext('2d');
  // gradient sky
  const grad = bctx.createLinearGradient(0, 0, 0, CFG.SCREEN_H);
  grad.addColorStop(0, COLORS.BG_TOP);
  grad.addColorStop(1, COLORS.BG_BOT);
  bctx.fillStyle = grad;
  bctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);
  // mountains
  bctx.fillStyle = '#2d3246';
  bctx.beginPath();
  bctx.moveTo(0, CFG.FLOOR_Y - 80);
  for (let i = 0; i <= CFG.SCREEN_W; i += 80) {
    const h = 30 + Math.floor(60 * Math.sin(i * 0.013)) + Math.floor(40 * Math.cos(i * 0.007));
    bctx.lineTo(i, CFG.FLOOR_Y - 100 - h);
  }
  bctx.lineTo(CFG.SCREEN_W, CFG.FLOOR_Y - 80);
  bctx.lineTo(CFG.SCREEN_W, CFG.FLOOR_Y);
  bctx.lineTo(0, CFG.FLOOR_Y);
  bctx.closePath();
  bctx.fill();
  // floor
  bctx.fillStyle = COLORS.FLOOR;
  bctx.fillRect(0, CFG.FLOOR_Y, CFG.SCREEN_W, CFG.SCREEN_H - CFG.FLOOR_Y);
  for (let i = 0; i < CFG.SCREEN_W; i += 40) {
    bctx.strokeStyle = '#281e14';
    bctx.beginPath();
    bctx.moveTo(i, CFG.FLOOR_Y);
    bctx.lineTo(i + 20, CFG.SCREEN_H);
    bctx.stroke();
  }
  // walls
  bctx.fillStyle = COLORS.WALL;
  bctx.fillRect(0, 0, CFG.LEFT_WALL, CFG.FLOOR_Y);
  bctx.fillRect(CFG.RIGHT_WALL, 0, CFG.SCREEN_W - CFG.RIGHT_WALL, CFG.FLOOR_Y);
  // wall stripes
  bctx.fillStyle = '#3c3228';
  for (let y = 0; y < CFG.FLOOR_Y; y += 60) {
    bctx.fillRect(CFG.LEFT_WALL - 8, y, 8, 30);
    bctx.fillRect(CFG.RIGHT_WALL, y, 8, 30);
  }
  return bg;
}

// ----- Controls reference (shared by the CONTROLS screen and the in-battle H overlay) -----
function keyName(code) {
  const map = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓',
    Period: '.', Comma: ',', Slash: '/', Semicolon: ';', BracketLeft: '[', BracketRight: ']', Space: 'SPACE' };
  if (map[code]) return map[code];
  return code.replace(/^Key/, '').replace(/^Digit/, '');
}

function drawControlsPanel(ctx) {
  const k1 = (r) => keyName(P1_KEYS[r]);
  ctx.save();
  ctx.textAlign = 'left';
  ctx.font = 'bold 40px "Trebuchet MS", Arial';
  ctx.fillStyle = COLORS.ACCENT;
  ctx.fillText('CONTROLS', 60, 62);

  // Key table (generated from the real key maps so it can never go out of date)

    ['left', 'Move left'], ['right', 'Move right'], ['up', 'Up  (launcher / tilt)'], ['down', 'Down  (slam / tilt)'],
    ['jump', 'Jump  (2nd press = air dash)'], ['attack', 'Attack'], ['guard', 'Guard (hold) / Perfect Block (tap)'],
    ['chakra', 'Chakra load (hold)'], ['sub', 'Substitution (while hit)'],
    ['leader_prev', 'Change leader ◀'], ['leader_next', 'Change leader ▶'],
    ['shuriken', 'Shuriken (15 chakra)'], ['assist', 'Team assist (25 Storm)'],

  });

  // Global keys
  const gy = y0 + 26 + rows.length * lh + 22;
  ctx.font = 'bold 15px Arial'; ctx.fillStyle = COLORS.ACCENT; ctx.fillText('MENUS & GLOBAL', 60, gy);
  ctx.font = '14px Arial'; ctx.fillStyle = COLORS.TEXT;
  const globals = [
    'ENTER / SPACE  confirm / next dialogue line', 'ESC  back (battle → team select)',

  ];
  globals.forEach((g, i) => ctx.fillText(g, 60, gy + 22 + i * 20));

  // Signature moves (Naruto / Sasuke)
  const sy0 = gy + 22 + globals.length * 20 + 10;
  ctx.font = 'bold 15px Arial'; ctx.fillStyle = COLORS.ACCENT;
  ctx.fillText(`SIGNATURE MOVES  (${k1('chakra')} + direction + ${k1('attack')})`, 60, sy0);
  ctx.font = '13px Arial'; ctx.fillStyle = COLORS.TEXT;
  [
    'Naruto   ↑ Rasenshuriken (60)   ↓ Shadow Clones (35)',
    '              in air ↓  Uzumaki Barrage (30)',
    'Sasuke   ↑ Kirin (55)   ↓ Great Fireball (40)',
    '              in air ↓  Phoenix Flower (30)',
  ].forEach((l, i) => ctx.fillText(l, 60, sy0 + 19 + i * 17));

  // Move list
  const mx = 500;
  let my = 110;
  const section = (title, lines) => {
    ctx.font = 'bold 17px "Trebuchet MS", Arial'; ctx.fillStyle = COLORS.ACCENT; ctx.fillText(title, mx, my); my += 22;
    ctx.font = '14px Arial';
    for (const [a, b] of lines) {
      ctx.fillStyle = COLORS.P1; ctx.fillText(a, mx, my);
      ctx.fillStyle = COLORS.TEXT; ctx.fillText(b, mx + 215, my);
      my += 19;
    }
    my += 10;
  };
  section('BASIC', [
    [`${k1('attack')}, ${k1('attack')}`, '2-hit combo (light then heavy finisher)'],
    [`${k1('up')} + ${k1('attack')}`, 'Launcher - sends the opponent airborne'],
    [`${k1('down')} + ${k1('attack')}`, 'Slam - smashes the opponent down'],
    [`${k1('jump')} then ${k1('attack')}`, 'Air attack'],
    [`${k1('jump')} (in air) + ${k1('left')}/${k1('right')}`, 'Air dash (once per jump, brief invincibility)'],
    [`flick ${k1('up')}/${k1('down')}/${k1('left')}/${k1('right')} + ${k1('attack')}`, 'Tilt attack'],
    ['Hold toward a wall in the air', 'Wall-run'],
  ]);
  section('DEFENSE', [
    [`hold ${k1('guard')}`, 'Block. Chip damage, drains the GUARD gauge'],
    [`tap ${k1('guard')} just before a hit`, 'PERFECT BLOCK: no damage, staggers attacker, +chakra'],
    ['Guard gauge empty / huge hit', 'GUARD BREAK: stunned and unable to guard for 2s'],
    ['Attacks from behind', 'Cannot be blocked (cross-ups after a substitution)'],
    [`${k1('sub')} while being hit`, 'Substitution: teleport behind opponent'],
    [`${k1('chakra')} + ${k1('guard')} + ${k1('attack')}`, 'Counter (30 chakra) - stuns an attacking opponent'],
