    [`${k1('chakra')} + ${k1('up')}/${k1('down')} + ${k1('attack')}`, 'Naruto / Sasuke signature moves (see left)'],
    [`${k1('chakra')} + ${k1('jump')}`, 'Chakra dash (25 chakra)'],
    [`tap ${k1('chakra')} x2, then ${k1('chakra')} + ${k1('attack')}`, 'Ultimate Jutsu (75 chakra, cinematic)'],
    [`tap ${k1('chakra')} x3, then ${k1('chakra')} + ${k1('attack')}`, 'Linked Secret Technique (needs full Storm)'],
    [`hold ${k1('chakra')} (low HP / full Storm)`, 'Awakening - boosts damage, speed and chakra'],
  ]);
  ctx.font = '14px Arial'; ctx.fillStyle = COLORS.TEXT_DIM;
  ctx.fillText('Move list shows P1 keys; P2 uses the P2 column on the left.', mx, my);
  ctx.restore();
}

class ControlsScene {
  constructor(game, back) { this.game = game; this.back = back; this.t = 0; }
  update(dt, events) {
    this.t++;
    for (const e of events) {
      if (e.type === 'keydown' && (e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space')) {
        this.game.scene = new TitleScene(this.game); return;
      }
    }
  }
  draw(ctx) {
    ctx.drawImage(this.game.bg, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);
    drawControlsPanel(ctx);
    ctx.font = '16px Arial'; ctx.fillStyle = COLORS.TEXT_DIM; ctx.textAlign = 'center';
    if (this.t % 60 < 40) ctx.fillText('ENTER or ESC to return', CFG.SCREEN_W / 2, CFG.SCREEN_H - 20);
  }
}


// ============================================================================
// ONLINE MODE - matchmaking lobby (connects to ranked match vs skilled CPU)
// Note: True peer-to-peer online requires a signaling server. This provides
// a full online-style experience with matchmaking UI and ranked fights.
// ============================================================================
class OnlineLobbyScene {
  constructor(game) {
    this.game = game;
    this.t = 0;
    this.state = 'searching'; // searching -> found -> teamselect -> fighting
    this.searchTime = 0;
    this.matchFoundAt = 0;
    this.dots = 0;
    this.opponentName = '';
    this.opponentRank = '';
    this.myRank = 'Chunin';
    this.ping = 0;
    this.names = [
      'ShadowClone99', 'RasenganKing', 'UchihaFan', 'SandStorm_G', 'ByakuganEye',
      'LotusBlossom', 'SamehadaUser', 'LeafVillagePro', 'ChidoriStrike', 'TailedBeast',
      'NinjaOfTheMist', 'YouthfulTaijutsu', 'SharinganMaster', 'KazekageRise', 'HiddenLeaf'
    ];
    this.ranks = ['Genin', 'Chunin', 'Jonin', 'Anbu', 'Kage'];
  }
  update(dt, events) {
    this.t++;
    this.searchTime++;
    if (this.t % 20 === 0) this.dots = (this.dots + 1) % 4;

    for (const e of events) {
      if (e.type !== 'keydown') continue;
      if (e.code === 'Escape') {
        this.game.scene = new TitleScene(this.game);
        return;
      }
      if (this.state === 'found' && (e.code === 'Enter' || e.code === 'Space')) {
        // Proceed to team select in online (CPU) mode
        const ts = new TeamSelectScene(this.game);
        ts.cpuMode = true;
        ts.onlineMode = true;
        ts.opponentName = this.opponentName;
        this.game.scene = ts;
        return;
      }
    }

    // Fake matchmaking: after 2.5–5 seconds find an opponent
    if (this.state === 'searching' && this.searchTime > 150 + Math.random() * 90) {
      this.state = 'found';
      this.matchFoundAt = this.t;
      this.opponentName = this.names[Math.floor(Math.random() * this.names.length)];
      this.opponentRank = this.ranks[Math.floor(Math.random() * this.ranks.length)];
      this.ping = 28 + Math.floor(Math.random() * 80);
    }
  }
  draw(ctx) {
    const g = this.game;
    ctx.drawImage(g.bg, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);

    ctx.save();
    ctx.textAlign = 'center';

    // Title
    ctx.font = 'bold 56px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.ACCENT;
    ctx.fillText('ONLINE MODE', CFG.SCREEN_W / 2, 100);

    ctx.font = '20px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.TEXT_DIM;
    ctx.fillText('Ranked Matchmaking', CFG.SCREEN_W / 2, 140);

    // Player card (left)
    this._drawPlayerCard(ctx, 180, 220, 'YOU', this.myRank, '#ffd87a', true);

    // VS
    ctx.font = 'bold 48px "Trebuchet MS", Arial';
    ctx.fillStyle = '#ff5050';
    ctx.fillText('VS', CFG.SCREEN_W / 2, 340);

    // Opponent card (right)
    if (this.state === 'searching') {
      this._drawPlayerCard(ctx, CFG.SCREEN_W - 180 - 280, 220, '???', '???', '#888', false);
    } else {
      this._drawPlayerCard(ctx, CFG.SCREEN_W - 180 - 280, 220, this.opponentName, this.opponentRank, '#8cdcff', false);
    }

    // Status
    ctx.font = 'bold 28px "Trebuchet MS", Arial';
    if (this.state === 'searching') {
      const d = '.'.repeat(this.dots);
      ctx.fillStyle = COLORS.TEXT;
      ctx.fillText('Searching for opponent' + d, CFG.SCREEN_W / 2, 480);
      // Spinner
      const ang = this.t * 0.12;
      ctx.strokeStyle = COLORS.ACCENT;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(CFG.SCREEN_W / 2, 540, 22, ang, ang + Math.PI * 1.4);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#50ff80';
      ctx.fillText('MATCH FOUND!', CFG.SCREEN_W / 2, 480);
      ctx.font = '20px "Trebuchet MS", Arial';
      ctx.fillStyle = COLORS.TEXT;
      ctx.fillText(`Ping: ${this.ping} ms  |  Ranked`, CFG.SCREEN_W / 2, 520);
      ctx.fillStyle = COLORS.ACCENT;
      ctx.fillText('Press ENTER to accept and pick your team', CFG.SCREEN_W / 2, 560);
    }

    ctx.font = '16px "Trebuchet MS", Arial';
    ctx.fillStyle = '#666';
    ctx.fillText('ESC to cancel  |  Online mode currently matches you vs skilled CPU', CFG.SCREEN_W / 2, CFG.SCREEN_H - 30);
    ctx.restore();
  }
  _drawPlayerCard(ctx, x, y, name, rank, color, isYou) {
    ctx.fillStyle = '#1a1a28';
    ctx.fillRect(x, y, 280, 160);
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, 280, 160);

    ctx.textAlign = 'center';
    ctx.font = 'bold 14px "Trebuchet MS", Arial';
    ctx.fillStyle = isYou ? '#ffd87a' : '#8cdcff';
    ctx.fillText(isYou ? 'PLAYER 1' : 'OPPONENT', x + 140, y + 28);

    ctx.font = 'bold 26px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.TEXT;
    ctx.fillText(name, x + 140, y + 70);

    ctx.font = '18px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.ACCENT;
    ctx.fillText(rank, x + 140, y + 105);

    // Rank badge
    ctx.fillStyle = 'rgba(255,180,60,0.15)';
    ctx.fillRect(x + 40, y + 120, 200, 28);
    ctx.fillStyle = COLORS.TEXT_DIM;
    ctx.font = '14px "Trebuchet MS", Arial';
    ctx.fillText(isYou ? 'Ready' : (this.state === 'found' ? 'Connected' : 'Searching...'), x + 140, y + 140);
  }
}

class TitleScene {
  constructor(game) {
    this.game = game;
    this.t = 0;
    this.menuIndex = 0;
    this.menuItems = ['VS CPU BATTLE', 'STORY MODE', 'SOLO MODE', 'ONLINE MODE', '2-PLAYER VS', 'TRAINING', 'CONTROLS'];
  }
  update(dt, events) {
    this.t++;
    for (const e of events) {
      if (e.type === 'keydown') {
        if (e.code === 'ArrowUp' || e.code === 'KeyW') {
          this.menuIndex = (this.menuIndex - 1 + this.menuItems.length) % this.menuItems.length;
        } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
          this.menuIndex = (this.menuIndex + 1) % this.menuItems.length;
        } else if (e.code === 'Enter' || e.code === 'Space') {
          if (this.menuIndex === 0) {
            // VS CPU - go to team select (3-character teams)
            this.game.scene = new TeamSelectScene(this.game);
          } else if (this.menuIndex === 1) {
            // Story Mode
            this.game.scene = new StoryScene(this.game, 0);
          } else if (this.menuIndex === 2) {
            // SOLO MODE - play as one person (1v1 single character)
            const ts = new TeamSelectScene(this.game);
            ts.soloMode = true;
            ts.cpuMode = true;
            this.game.scene = ts;
          } else if (this.menuIndex === 3) {
            // ONLINE MODE - matchmaking lobby then fight
            this.game.scene = new OnlineLobbyScene(this.game);
          } else if (this.menuIndex === 4) {
            // 2-Player - go to team select with 2P mode
            const ts = new TeamSelectScene(this.game);
            ts.cpuMode = false;
            this.game.scene = ts;
          } else if (this.menuIndex === 5) {
            // Training - VS CPU with a controllable dummy, no timer, no KO
            const ts = new TeamSelectScene(this.game);
            ts.cpuMode = true; ts.training = true;
            this.game.scene = ts;
          } else {
            this.game.scene = new ControlsScene(this.game);
          }
        }
        // (ESC used to set game.running = false, which just froze the page on a dead frame -
        //  a browser tab can't "quit", so ESC is now ignored on the title screen.)
      }
    }
  }
  draw(ctx) {
    const g = this.game;
    ctx.drawImage(g.bg, 0, 0);

    // Hero portrait - positioned to the right, away from centered title text
    const sp = g.assets;
    const frame = sp.getFrame('naruto', 'idle', 0);
    const atlas = sp.atlases.naruto;
    if (frame && atlas) {
      const scale = 3;
      const dw = frame.src_w * scale, dh = frame.src_h * scale;
      // Place on right side, anchored to floor
      const heroX = CFG.SCREEN_W - 200 - dw / 2;
      ctx.drawImage(atlas, frame.src_x, frame.src_y, frame.src_w, frame.src_h,
        heroX, CFG.FLOOR_Y - dh, dw, dh);
    }

    ctx.save();
    ctx.textAlign = 'center';
    // Title
    ctx.font = 'bold 72px "Trebuchet MS", Arial';
    ctx.fillStyle = '#000';
    ctx.fillText('NARUTO STORM 4', CFG.SCREEN_W / 2 + 4, 184);
    ctx.fillStyle = COLORS.ACCENT;
    ctx.fillText('NARUTO STORM 4', CFG.SCREEN_W / 2, 180);
    // Subtitle
    ctx.font = 'bold 48px "Trebuchet MS", Arial';
    ctx.fillStyle = '#000';
    ctx.fillText('2D FAN GAME', CFG.SCREEN_W / 2 + 3, 253);
    ctx.fillStyle = COLORS.TEXT;
    ctx.fillText('2D FAN GAME', CFG.SCREEN_W / 2, 250);

    // Menu items
    ctx.textAlign = 'center';
    const menuY = 400;
    const menuSpacing = 44;
    for (let i = 0; i < this.menuItems.length; i++) {
      const y = menuY + i * menuSpacing;
      const isSelected = i === this.menuIndex;
      ctx.font = isSelected ? 'bold 32px "Trebuchet MS", Arial' : '24px "Trebuchet MS", Arial';
      if (isSelected) {
        // Selection indicator
        ctx.fillStyle = COLORS.ACCENT;
        ctx.fillText('> ' + this.menuItems[i] + ' <', CFG.SCREEN_W / 2, y);
      } else {
        ctx.fillStyle = COLORS.TEXT_DIM;
        ctx.fillText(this.menuItems[i], CFG.SCREEN_W / 2, y);
      }
    }

    // Footer
    ctx.font = '14px Arial';
    ctx.fillStyle = COLORS.TEXT_DIM;
    ctx.textAlign = 'left';
    ctx.fillText('W/S or Up/Down to choose, ENTER to select  |  Fan game - sprites ripped by Deekman et al.', 20, CFG.SCREEN_H - 30);
    ctx.restore();
  }
}

class TeamSelectScene {
  constructor(game) {
    this.game = game;
    this.soloMode = false; // set true for 1v1 single-character battles
    this.picks = [DEFAULT_TEAMS.P1.slice(), DEFAULT_TEAMS.P2.slice()];
    this.cursor = [0, 0];
    this.activePlayer = 0;
    this.charList = Object.keys(CHARS_DATA);
    this.charIdx = [this.charList.indexOf(this.picks[0][0]), this.charList.indexOf(this.picks[1][0])];
    // Remember the last mode so ESC / Rematch from a 2-player match doesn't silently flip back to VS CPU
    this.cpuMode = game.cpuMode !== undefined ? game.cpuMode : true;
  }
  _setPick(player, char) {
    const slot = this.cursor[player];
    if (this.picks[player].includes(char) && this.picks[player][slot] !== char) return;
    this.picks[player][slot] = char;
  }
  update(dt, events) {
    for (const e of events) {
      if (e.type !== 'keydown') continue;
      if (e.code === 'Escape') { this.game.scene = new TitleScene(this.game); return; }
      if (e.code === 'Tab') { if (!this.training) this.cpuMode = !this.cpuMode; continue; }
      if (this.activePlayer === 0) {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
          this.charIdx[0] = (this.charIdx[0] - 1 + this.charList.length) % this.charList.length;
          this._setPick(0, this.charList[this.charIdx[0]]);
        } else if (e.code === 'KeyD' || e.code === 'ArrowRight') {
          this.charIdx[0] = (this.charIdx[0] + 1) % this.charList.length;
          this._setPick(0, this.charList[this.charIdx[0]]);
        } else if (e.code === 'KeyW' || e.code === 'ArrowUp') {
          this.cursor[0] = (this.cursor[0] - 1 + 3) % 3;
          this.charIdx[0] = this.charList.indexOf(this.picks[0][this.cursor[0]]);
        } else if (e.code === 'KeyS' || e.code === 'ArrowDown') {
          this.cursor[0] = (this.cursor[0] + 1) % 3;
          this.charIdx[0] = this.charList.indexOf(this.picks[0][this.cursor[0]]);
        } else if (e.code === 'Enter' || e.code === 'Space') {
          this.activePlayer = 1;
          if (this.cpuMode) this.startBattle();
        }
      } else {
        if (e.code === 'ArrowLeft') {
          this.charIdx[1] = (this.charIdx[1] - 1 + this.charList.length) % this.charList.length;
          this._setPick(1, this.charList[this.charIdx[1]]);
        } else if (e.code === 'ArrowRight') {
          this.charIdx[1] = (this.charIdx[1] + 1) % this.charList.length;
          this._setPick(1, this.charList[this.charIdx[1]]);
        } else if (e.code === 'ArrowUp') {
          this.cursor[1] = (this.cursor[1] - 1 + 3) % 3;
          this.charIdx[1] = this.charList.indexOf(this.picks[1][this.cursor[1]]);
        } else if (e.code === 'ArrowDown') {
          this.cursor[1] = (this.cursor[1] + 1) % 3;
          this.charIdx[1] = this.charList.indexOf(this.picks[1][this.cursor[1]]);
        } else if (e.code === 'Enter' || e.code === 'Space') {
          this.startBattle();
        }
      }
    }
  }
  startBattle() {
    if (this.soloMode) {
      // Play as one person: force single-character teams
      this.picks[0] = [this.picks[0][this.cursor[0] || 0]];
      if (this.cpuMode) {
        // CPU picks a random different character
        const others = this.charList.filter(c => c !== this.picks[0][0]);
        this.picks[1] = [others[Math.floor(Math.random() * others.length)]];
      } else {
        this.picks[1] = [this.picks[1][this.cursor[1] || 0]];
      }
    } else if (this.cpuMode) {
      this.picks[1] = DEFAULT_TEAMS.P2.slice();
    }
    this.game.cpuMode = this.cpuMode;
    const bs = new BattleScene(this.game, this.picks[0], this.picks[1], this.cpuMode);
    if (this.training) bs.enableTraining();
    this.game.scene = bs;
  }
  draw(ctx) {
    const g = this.game;
    ctx.drawImage(g.bg, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.ACCENT;
    ctx.fillText('SELECT YOUR TEAM', CFG.SCREEN_W / 2, 90);
    ctx.font = 'bold 24px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.TEXT;
    let modeLabel = '2-PLAYER MODE (TAB to toggle)';
    if (this.soloMode) modeLabel = 'SOLO MODE - Pick 1 character (1v1)';
    else if (this.training) modeLabel = 'TRAINING MODE';
    else if (this.onlineMode) modeLabel = 'ONLINE RANKED vs ' + (this.opponentName || 'Opponent');
    else if (this.cpuMode) modeLabel = 'VS CPU (TAB to toggle)';
    ctx.fillText(modeLabel, CFG.SCREEN_W / 2, 130);

    for (let p = 0; p < 2; p++) {
      const sideX = p === 0 ? 80 : CFG.SCREEN_W - 80 - 320;
      const active = p === this.activePlayer;
      const label = p === 0 ? 'PLAYER 1' : (this.cpuMode ? 'CPU' : 'PLAYER 2');
      ctx.font = 'bold 24px "Trebuchet MS", Arial';
      ctx.fillStyle = active ? '#ffdc64' : COLORS.TEXT_DIM;
      ctx.textAlign = 'left';
      ctx.fillText(label, sideX, 170);
      for (let slot = 0; slot < 3; slot++) {
        const slotY = 210 + slot * 100;
        const char = this.picks[p][slot];
        ctx.fillStyle = '#1e1e28';
        ctx.fillRect(sideX, slotY, 320, 90);
        ctx.strokeStyle = (active && this.cursor[p] === slot) ? COLORS.ACCENT : '#505064';
        ctx.lineWidth = (active && this.cursor[p] === slot) ? 3 : 2;
        ctx.strokeRect(sideX, slotY, 320, 90);
        // portrait
        const frame = g.assets.getFrame(char, 'idle', 0);
        const atlas = g.assets.getAtlas(char);
        if (frame && atlas) {
          const ratio = 60 / Math.max(frame.src_w, frame.src_h);
          ctx.drawImage(atlas, frame.src_x, frame.src_y, frame.src_w, frame.src_h,
            sideX + 20, slotY + 8 + (70 - frame.src_h * ratio) / 2,
            frame.src_w * ratio, frame.src_h * ratio);
        }
        // name + stats
        ctx.font = 'bold 22px "Trebuchet MS", Arial';
        ctx.fillStyle = COLORS.TEXT;
        ctx.fillText(CHARS_DATA[char].display, sideX + 100, slotY + 28);
        ctx.font = '13px Arial';
        ctx.fillStyle = '#c8c8dc';
        const stats = CHARS_DATA[char].stats;
        ctx.fillText(`PWR ${stats.power}   SPD ${stats.speed}   RNG ${stats.range}`, sideX + 100, slotY + 50);
        ctx.font = '12px Arial';
        ctx.fillStyle = '#a0a0b4';
        ctx.fillText(CHARS_DATA[char].subtitle, sideX + 100, slotY + 70);
      }
    }

    // Roster at bottom
    const palY = 540;
    ctx.font = 'bold 22px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.TEXT;
    ctx.textAlign = 'center';
    ctx.fillText('ROSTER', CFG.SCREEN_W / 2, palY - 12);
    const slotW = 110;
    const totalW = slotW * this.charList.length;
    const startX = CFG.SCREEN_W / 2 - totalW / 2;
    for (let i = 0; i < this.charList.length; i++) {
      const c = this.charList[i];
      const cx = startX + i * slotW;
      ctx.fillStyle = '#1e1e28';
      ctx.fillRect(cx, palY, slotW - 10, 100);
      const sel = i === this.charIdx[this.activePlayer];
      ctx.strokeStyle = sel ? COLORS.ACCENT : '#3c3c50';
      ctx.lineWidth = sel ? 3 : 2;
      ctx.strokeRect(cx, palY, slotW - 10, 100);
      const frame = g.assets.getFrame(c, 'idle', 0);
      const atlas = g.assets.getAtlas(c);
      if (frame && atlas) {
        const ratio = 60 / Math.max(frame.src_w, frame.src_h);
        const dw = frame.src_w * ratio, dh = frame.src_h * ratio;
        ctx.drawImage(atlas, frame.src_x, frame.src_y, frame.src_w, frame.src_h,
          cx + (slotW - 10) / 2 - dw / 2, palY + 8, dw, dh);
      }
      ctx.font = '14px Arial';
      ctx.fillStyle = COLORS.TEXT;
      ctx.fillText(CHARS_DATA[c].display, cx + (slotW - 10) / 2, palY + 92);
    }
    ctx.font = '16px Arial';
    ctx.fillStyle = COLORS.TEXT;
    ctx.fillText(this.activePlayer === 0
      ? 'P1: A/D or arrows to browse, W/S to change slot, ENTER to confirm'
      : 'P2: arrows to browse, Up/Down to change slot, ENTER to confirm   |   TAB: toggle CPU',
      CFG.SCREEN_W / 2, CFG.SCREEN_H - 20);
    ctx.restore();
  }
}

class StoryScene {
  constructor(game, chapterIndex) {
    this.game = game;
    this.chapterIndex = chapterIndex;
    this.chapter = STORY_DATA[chapterIndex];
    this.dialogueIndex = 0;
    this.t = 0;
    this.transitionState = 'dialogue'; // 'dialogue' -> 'battle' -> 'result' -> next chapter
    this.battleScene = null;
    this.battleResult = null;
    this.fadeAlpha = 0;
    this.fadeDir = 0; // 1 = fade out, -1 = fade in
  }

  update(dt, events) {
    this.t++;

    if (this.fadeDir !== 0) {
      this.fadeAlpha += this.fadeDir * 0.04;
      if (this.fadeAlpha >= 1) {
        this.fadeAlpha = 1;
        this.fadeDir = -1;
        this._doTransition();
      } else if (this.fadeAlpha <= 0) {
        this.fadeAlpha = 0;
        this.fadeDir = 0;
      }
      return;
    }

    if (this.transitionState === 'dialogue') {
      for (const e of events) {
        if (e.type === 'keydown') {
          if (e.code === 'Enter' || e.code === 'Space') {
            this.dialogueIndex++;
            if (this.dialogueIndex >= this.chapter.dialogue.length) {
              // Move to battle (or epilogue ending)
              if (this.chapter.battle) {
                this.fadeDir = 1;
              } else {
                // Epilogue - return to title
                this.fadeDir = 1;
              }
            }
          } else if (e.code === 'Escape') {
            this.game.scene = new TitleScene(this.game);
            return;
          }
        }
      }
    } else if (this.transitionState === 'battle') {
      // Filter ESC events - in story mode, ESC goes to title (not team select)
      const filteredEvents = events.filter(e => !(e.type === 'keydown' && e.code === 'Escape'));
      // Check for ESC separately
      for (const e of events) {
        if (e.type === 'keydown' && e.code === 'Escape') {
          this.game.scene = new TitleScene(this.game);
          return;
        }
      }
      // Update the battle scene with filtered events
      this.battleScene.update(dt, filteredEvents);
      // Check if battle is over
      if (this.battleScene.roundState === 'ko' && this.battleScene.stateTimer <= 0) {
        // Battle ended - check result
        // A draw (equal health on time-up) counts as a loss so the player has to actually win
        const winner = this.battleScene._winner() === 1 ? 1 : 2;
        this.battleResult = winner;
        if (winner === 1) {
          // Player won - advance to next chapter
          this.fadeDir = 1;
        } else {
          // Player lost - retry battle
          this.transitionState = 'defeat';
          this.defeatTimer = 120;
        }
      }
    } else if (this.transitionState === 'defeat') {
      this.defeatTimer--;
      for (const e of events) {
        if (e.type !== 'keydown') continue;
        if (e.code === 'Enter' || e.code === 'Space') {
          // Retry battle
          this._startBattle();
          return;
        } else if (e.code === 'Escape') {
          this.game.scene = new TitleScene(this.game);
          return;
        }
      }
    }
  }

  _doTransition() {
    if (this.transitionState === 'dialogue') {
      if (this.chapter.battle) {
        this._startBattle();
      } else {
        // Epilogue complete - go to title
        this.game.scene = new TitleScene(this.game);
      }
    } else if (this.transitionState === 'battle') {
      // Battle won - advance to next chapter
      if (this.chapterIndex + 1 < STORY_DATA.length) {
        this.game.scene = new StoryScene(this.game, this.chapterIndex + 1);
      } else {
        // Story complete
        this.game.scene = new TitleScene(this.game);
      }
    }
  }

  _startBattle() {
    const b = this.chapter.battle;
    const bs = new BattleScene(this.game, b.p1Team, b.p2Team, true);
    bs.storyMode = true; // Prevent BattleScene from creating its own ResultScene
    // Set CPU difficulty
    if (bs.cpu) {
      bs.cpu._difficulty = b.difficulty;
    }
    this.battleScene = bs;
    this.transitionState = 'battle';
    this.game.scene = this; // keep this scene active (it delegates to battleScene)
  }

  draw(ctx) {
    if (this.transitionState === 'battle' || this.transitionState === 'defeat') {
      this.battleScene.draw(ctx);
    } else {
      this._drawDialogue(ctx);
    }

    if (this.transitionState === 'defeat') {
      this._drawDefeat(ctx);
    }

    // Fade overlay
    if (this.fadeAlpha > 0) {
      ctx.fillStyle = `rgba(0,0,0,${this.fadeAlpha})`;
      ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);
    }
  }

  _drawDialogue(ctx) {
    const g = this.game;
    ctx.drawImage(g.bg, 0, 0);
    // Dim overlay
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);

    ctx.save();
    ctx.textAlign = 'center';

    // Chapter title
    ctx.font = 'bold 36px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.ACCENT;
    ctx.fillText(this.chapter.title, CFG.SCREEN_W / 2, 120);

    // Current dialogue
    if (this.dialogueIndex < this.chapter.dialogue.length) {
      const line = this.chapter.dialogue[this.dialogueIndex];
      const charData = CHARS_DATA[line.speaker];

      // Draw speaker portrait on the left
      const frame = g.assets.getFrame(line.speaker, 'idle', 0);
      const atlas = g.assets.getAtlas(line.speaker);
      if (frame && atlas) {
        const portraitScale = 2;
        const pw = frame.src_w * portraitScale;
        const ph = frame.src_h * portraitScale;
        // Position portrait on left side
        const px = 150;
        const py = CFG.FLOOR_Y - ph - 20;
        ctx.drawImage(atlas, frame.src_x, frame.src_y, frame.src_w, frame.src_h, px, py, pw, ph);
        // Name above portrait
        ctx.font = 'bold 28px "Trebuchet MS", Arial';
        ctx.fillStyle = charData.color;
        ctx.textAlign = 'center';
        ctx.fillText(charData.display, px + pw / 2, py - 15);
      }

      // Draw dialogue text box on the right
      const boxX = 380;
      const boxY = 380;
      const boxW = 820;
      const boxH = 180;
      ctx.fillStyle = 'rgba(20,20,35,0.9)';
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeStyle = charData.color;
      ctx.lineWidth = 3;
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      // Speaker name in the box
      ctx.font = 'bold 24px "Trebuchet MS", Arial';
      ctx.fillStyle = charData.color;
      ctx.textAlign = 'left';
      ctx.fillText(charData.display, boxX + 20, boxY + 35);

      // Dialogue text (word-wrapped)
      ctx.font = '22px "Trebuchet MS", Arial';
      ctx.fillStyle = COLORS.TEXT;
      const words = line.text.split(' ');
      let currentLine = '';
      const lines = [];
      const maxLineWidth = boxW - 40;
      for (const word of words) {
        const testLine = currentLine ? currentLine + ' ' + word : word;
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxLineWidth) {
          lines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) lines.push(currentLine);
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], boxX + 20, boxY + 70 + i * 28);
      }

      // Advance prompt
      if (this.t % 60 < 35) {
        ctx.font = '16px Arial';
        ctx.fillStyle = COLORS.TEXT_DIM;
        ctx.textAlign = 'right';
        ctx.fillText('ENTER to continue >', boxX + boxW - 15, boxY + boxH - 15);
      }

      // Dialogue progress indicator
      ctx.textAlign = 'left';
      ctx.font = '14px Arial';
      ctx.fillStyle = COLORS.TEXT_DIM;
      ctx.fillText(`${this.dialogueIndex + 1} / ${this.chapter.dialogue.length}`, boxX + 20, boxY + boxH - 15);
    }

    ctx.restore();
  }

  _drawDefeat(ctx) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 56px "Trebuchet MS", Arial';
    ctx.fillStyle = '#ff5050';
    ctx.fillText('DEFEATED', CFG.SCREEN_W / 2, CFG.SCREEN_H / 2 - 40);
    ctx.font = 'bold 28px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.TEXT;
    ctx.fillText('ENTER to retry   |   ESC to title', CFG.SCREEN_W / 2, CFG.SCREEN_H / 2 + 30);
    ctx.restore();
  }
}

class BattleScene {
  constructor(game, p1, p2, cpuMode) {
    this.game = game;
    this.cpuMode = cpuMode;
    this.storyMode = false; // Set true by StoryScene to prevent ResultScene transition
    this.team1 = new Team(0, p1, 300, 1, game.assets);
    this.team2 = new Team(1, p2, CFG.SCREEN_W - 300, -1, game.assets);
    // Use the game's input mappers (which receive keyboard events) instead of creating new ones
    this.input1 = game.input1;
    this.input2 = game.input2;
    this.cpu = cpuMode ? new CpuBrain() : null;
    this.training = false;
    this.showHelp = false;     // H toggles the controls overlay (pauses the fight)
    this._dummyModes = ['stand', 'guard', 'ai'];
    this._dummyIdx = 0;
    this._calm = 0; this._lastHp = [CFG.MAX_HEALTH, CFG.MAX_HEALTH];
    this.effects = new EffectManager();
    this.hud1 = new HUD(this.team1, 'left');
    this.hud2 = new HUD(this.team2, 'right');
    this.combo1 = new ComboCounter('left');
    this.combo2 = new ComboCounter('right');
    this.roundState = 'intro';
    this.stateTimer = 90;
    this.roundTime = 99;
    this.hitstop = 0;
  }

  enableTraining() {
    this.training = true;
    if (this.cpu) this.cpu.mode = this._dummyModes[0];
  }

  _triggerCinematic(text, color, duration = 120, freezeFighter = null, otherFighter = null) {
    this.effects.triggerCinematic(text, duration, color);
    if (freezeFighter) freezeFighter.cinematicFreeze = Math.floor(duration / 2);
    if (otherFighter) otherFighter.cinematicFreeze = Math.floor(duration / 3);
  }

  update(dt, events) {
    for (const e of events) {
      if (e.type === 'keydown') {
        if (e.code === 'Escape') {
          if (this.showHelp) { this.showHelp = false; continue; }
          const ts = new TeamSelectScene(this.game);
          if (this.training) ts.training = true;
          this.game.scene = ts; return;
        }
        if (e.code === 'F1') this.game.debug = !this.game.debug;
        if (e.code === 'KeyH') this.showHelp = !this.showHelp;
        if (e.code === 'KeyT' && this.training && this.cpu) {
          this._dummyIdx = (this._dummyIdx + 1) % this._dummyModes.length;
          this.cpu.mode = this._dummyModes[this._dummyIdx];
        }
      }
    }
    // Controls overlay pauses everything
    if (this.showHelp) return;

    if (this.roundState === 'intro') {
      this.stateTimer--;
      if (this.stateTimer <= 0) {
        this.roundState = 'fight';
        this.effects.triggerCinematic('FIGHT!', 70, COLORS.ACCENT);
      }
      for (const f of [this.team1.leader, this.team2.leader]) {
        if (this.stateTimer > 30) f.state = ST.INTRO;
        else if (f.state === ST.INTRO) f.setState(ST.IDLE);
      }
      return;
    }

    if (this.roundState === 'ko') {
      this.stateTimer--;
      // Keep the world moving during the KO screen. Previously nothing was updated here, so the
      // "K.O.!" banner (driven by effects.update) never animated in and never showed, and a
      // white flash from the killing blow stayed stuck on screen for the whole KO pause.
      this.effects.update();
      this.team1.updateDisplayed();
      this.team2.updateDisplayed();
      this.team1.leader.update(this.team2.leader, this.team1, this.effects);
      this.team2.leader.update(this.team1.leader, this.team2, this.effects);
      if (this.stateTimer <= 0) {
        // In story mode, don't create ResultScene - the StoryScene handles transitions
        if (this.storyMode) return;
        this.game.scene = new ResultScene(this.game, this._winner(), this.team1, this.team2);
      }
      return;
    }

    if (this.hitstop > 0) {
      // Hit-stop freezes the fighters, but we must NOT consume input edges here
      // (a press during hit-stop is exactly when you'd buffer the next combo hit).
      this.hitstop--;
    } else {
      // Update input mappers
      this.input1.update();
      if (this.cpuMode) {
        const cpuState = this.cpu.update(this.team2.leader, this.team2, this.team1.leader, this.team1);
        this.input2.state = cpuState;
      } else {
        this.input2.update();
      }

      // Leader swaps
      if (this.input1.state.changeLeaderPrev || this.input1.state.changeLeaderNext) {
        const d = this.input1.state.changeLeaderNext ? 1 : -1;
        if (this.team1.swapLeader(d, this.team2)) {
          this.effects.spawnSmoke(this.team1.leader.x, this.team1.leader.y - 80, 8);
        }
      }
      if (this.input2.state.changeLeaderPrev || this.input2.state.changeLeaderNext) {
        const d = this.input2.state.changeLeaderNext ? 1 : -1;
        if (this.team2.swapLeader(d, this.team1)) {
          this.effects.spawnSmoke(this.team2.leader.x, this.team2.leader.y - 80, 8);
        }
      }

      this.team1.leader.applyInput(this.input1.state, this.team2.leader, this.team1, this.team2);
      this.team2.leader.applyInput(this.input2.state, this.team1.leader, this.team2, this.team1);
      this.team1.leader.update(this.team2.leader, this.team1, this.effects);
      this.team2.leader.update(this.team1.leader, this.team2, this.effects);
      // Signature-move name callouts (set by Fighter when a move starts)
      for (const f of [this.team1.leader, this.team2.leader]) {
        if (f.pendingCallout) {
          this.effects.addText(f.x, f.y - 180, f.pendingCallout.text, f.pendingCallout.color, 60);
          f.pendingCallout = null;
        }
      }
      // Fighter collision pushback: prevent sprites from overlapping
      this._resolveCollision();
      this._resolveHits(this.team1.leader, this.team2.leader, this.team1, this.team2, this.combo1);
      this._resolveHits(this.team2.leader, this.team1.leader, this.team2, this.team1, this.combo2);
      // Update projectiles (shuriken)
      this._updateProjectiles();
      // Update assists (support fighters)
      this._updateAssists();
      // Signature-move entities (shadow clones, Kirin bolts)
      this._updateFields();
    }

    this.effects.update();
    this.team1.updateDisplayed();
    this.team2.updateDisplayed();
    this.team1.updateSubs(dt);
    this.team2.updateSubs(dt);
    if (this.team1.swapCooldown > 0) this.team1.swapCooldown--;
    if (this.team2.swapCooldown > 0) this.team2.swapCooldown--;
    this.combo1.update();
    this.combo2.update();

    if (this.training) {
      // Practice: no timer, no KO, infinite chakra, health refills after a calm moment
      this.roundTime = 99;
      this.team1.leader.chakra = CFG.MAX_CHAKRA;
      this.team2.leader.chakra = CFG.MAX_CHAKRA;
      const hp = [this.team1.health, this.team2.health];
      if (hp[0] !== this._lastHp[0] || hp[1] !== this._lastHp[1]) this._calm = 0; else this._calm++;
      if (this._calm > 150 || hp[0] < 50 || hp[1] < 50) {
        this.team1.health = this.team2.health = CFG.MAX_HEALTH; this._calm = 0;
      }
      this._lastHp = [this.team1.health, this.team2.health];
    }
    this.roundTime -= dt;
    if (this.roundTime <= 0) {
      this.roundTime = 0;
      this.roundState = 'ko';
      this.stateTimer = 150;
      this.effects.triggerCinematic('TIME UP', 120, '#ffdc50');
      this._endRound();
    }

    if (this.team1.isDefeated() || this.team2.isDefeated()) {
      this.roundState = 'ko';
      this.stateTimer = 180;
      this.effects.triggerCinematic('K.O.!', 120, '#ff5050');
      this._endRound();
    }
  }

  // 1 = P1 wins, 2 = P2 wins, 0 = draw (equal health)
  _winner() {
    if (this.team1.health > this.team2.health) return 1;
    if (this.team2.health > this.team1.health) return 2;
    return 0;
  }

  // Called once when the round ends: clear cinematic freezes, knock out the loser
  _endRound() {
    const w = this._winner();
    for (const [team, id] of [[this.team1, 1], [this.team2, 2]]) {
      const f = team.leader;
      f.cinematicFreeze = 0;
      f.hitstun = 0;
      // Only a fighter whose team is actually out of health is "defeated" (not on a time-up)
      if (team.isDefeated() && w !== id) f.defeated = true;
    }
    this.team1.projectiles = []; this.team2.projectiles = [];
    this.team1.assists = []; this.team2.assists = [];
    this.team1.fields = []; this.team2.fields = [];
  }

  _resolveCollision() {
    const f1 = this.team1.leader;
    const f2 = this.team2.leader;
    if (f1.defeated || f2.defeated) return;
    const minDist = 85; // minimum horizontal distance between fighter centers
    const dx = f2.x - f1.x;
    const adx = Math.abs(dx);
    if (adx < minDist) {
      const overlap = minDist - adx;
      const sign = dx >= 0 ? 1 : -1; // sign: direction from f1 to f2
      // Push both fighters apart
      f1.x -= sign * overlap / 2;
      f2.x += sign * overlap / 2;
      // Zero out velocity component that's pushing them together
      if (sign > 0) { // f2 is to the right of f1
        if (f1.vx > 0) f1.vx *= 0.3;
        if (f2.vx < 0) f2.vx *= 0.3;
      } else { // f2 is to the left of f1
        if (f1.vx < 0) f1.vx *= 0.3;
        if (f2.vx > 0) f2.vx *= 0.3;
      }
      // Clamp to walls
      f1.x = Math.max(CFG.LEFT_WALL + 30, Math.min(CFG.RIGHT_WALL - 30, f1.x));
      f2.x = Math.max(CFG.LEFT_WALL + 30, Math.min(CFG.RIGHT_WALL - 30, f2.x));
    }
  }

  _updateProjectiles() {
    // Process projectiles from both teams (shuriken + Naruto / Sasuke signature projectiles)
    for (const team of [this.team1, this.team2]) {
      const enemyTeam = team === this.team1 ? this.team2 : this.team1;
      const enemy = enemyTeam.leader;
      team.projectiles = team.projectiles.filter(p => {
        p.age++;
        // Wind-up: a held projectile (Rasenshuriken) follows its owner until released
        if (p.hold > 0) {
          const o = p.owner;
          if (o.defeated || o.state !== ST.RASENSHURIKEN) {      // wind-up interrupted
            this.effects.spawnBurst(p.x, p.y, p.color, 12, 5, 16, 3, 0.05);
            return false;
          }
          p.hold--;
          p.spin += 0.3;
          p.facing = o.facing;
          p.x = o.x + o.facing * 50; p.y = o.y - 120;
          if (p.hold === 0) p.vx = o.facing * p.speed;
          return true;
        }
        // Move
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.grav;
        p.spin += 0.3;
        p.lifetime--;
        if (p.kind !== 'shuriken' && p.age % 2 === 0) {
          this.effects.spawnBurst(p.x - Math.sign(p.vx || 1) * 12, p.y, p.color, 2, 2, 14, p.small ? 2 : 3, 0.02);
        }
        // Check collision with enemy
        if (enemy && !enemy.defeated && !p.hitTargets.has(enemy)) {
          const dh = enemy.hurtbox, r = p.hitR || 0;
          if (p.x + r > dh.x && p.x - r < dh.x + dh.w && p.y + r > dh.y && p.y - r < dh.y + dh.h) {
            // Hit!
            p.hitTargets.add(enemy);
            const connected = enemy.takeHit(p.owner, MOVES.shuriken, p.damage, p.kb, p.hs, enemyTeam, this.effects,
              { launch: !!p.launch });
            if (connected) {
              team.gainStorm(p.kind === 'shuriken' ? 1 : 2);
              this.effects.spawnHitSpark(p.x, p.y, p.owner.data.color);
              this.hitstop = Math.max(this.hitstop, p.kind === 'shuriken' ? 3 : (p.damage >= 100 ? 9 : 4));
            }
            if (p.kind !== 'shuriken') this._projectileImpact(p, enemy, connected);
            p.lifetime = 0; // projectile disappears on hit
          }
        }
        // Falling projectiles (Phoenix Flower) burst when they reach the floor
        if (p.grav && p.y >= CFG.FLOOR_Y - 10 && p.lifetime > 0) {
          this._projectileImpact(p, null, false);
          p.lifetime = 0;
        }
        // Out of bounds
        if (p.x < 0 || p.x > CFG.SCREEN_W) p.lifetime = 0;
        return p.lifetime > 0;
      });
    }
  }

  // Visual feedback when a signature projectile lands (or is blocked)
  _projectileImpact(p, enemy, connected) {
    const fx2 = this.game.assets.metadata.fx2;
    if (p.hitAnim && fx2 && fx2[p.hitAnim]) {
      this.effects.addSpriteEffect(fx2[p.hitAnim], p.x, Math.min(p.y, CFG.FLOOR_Y - 30), 18, 'center', 'fx2', p.small ? 0.7 : 1.3);
    }
    if (p.kind === 'rasenshuriken') {
      // big blue burst (the Rasengan orb frames blown up) instead of the orange standard explosion
      if (fx2 && fx2.rasengan) this.effects.addSpriteEffect(fx2.rasengan, p.x, p.y, 14, 'center', 'fx2', 1.7);
      this.effects.spawnBurst(p.x, p.y, '#8fdcff', 30, 11, 30, 4, 0.05);
      this.effects.shakeScreen(connected ? 16 : 8);
      this.effects.whiteFlash(connected ? 0.55 : 0.25);
    } else {
      this.effects.spawnBurst(p.x, p.y, p.color, p.small ? 8 : 20, p.small ? 5 : 8, 22, p.small ? 3 : 4, 0.1);
      if (!p.small) this.effects.shakeScreen(connected ? 8 : 4);
    }
  }

  // ---------- Signature-move entities: Shadow Clones (Naruto) and Kirin bolts (Sasuke) ----------
  _updateFields() {
    for (const team of [this.team1, this.team2]) {
      const enemyTeam = team === this.team1 ? this.team2 : this.team1;
      const enemy = enemyTeam.leader;
      team.fields = team.fields.filter(f => {
        f.timer++;
        return f.type === 'clone' ? this._updateClone(f, team, enemyTeam, enemy)
                                  : this._updateBolt(f, team, enemyTeam, enemy);
      });
    }
  }

  _updateClone(c, team, enemyTeam, enemy) {
    if (c.timer <= c.delay) return true;                 // not on screen yet
    const t = c.timer - c.delay;
    if (t === 1) this.effects.spawnSmoke(c.x, c.y - 60, 8);
    if (!c.struck) {
      if (enemy && !enemy.defeated) {
        const dx = enemy.x - c.x;
        c.facing = dx >= 0 ? 1 : -1;
        if (Math.abs(dx) > 90 && t < 24) {
          c.x += c.facing * 13;                          // rush the opponent
        } else {
          c.struck = true; c.strikeT = t;
          const reach = 100, ax = c.facing === 1 ? c.x : c.x - reach;
          const ahb = { x: ax, y: c.y - 130, w: reach, h: 120 }, dh = enemy.hurtbox;
          if (ahb.x < dh.x + dh.w && ahb.x + ahb.w > dh.x && ahb.y < dh.y + dh.h && ahb.y + ahb.h > dh.y) {
            const connected = enemy.takeHit(c.owner, MOVES.assist, c.damage, c.kb, c.hs, enemyTeam, this.effects,
              { launch: c.launch });
            if (connected) {
              team.gainStorm(2);
              this.effects.spawnHitSpark(enemy.x, enemy.y - 80, c.owner.data.color);
              this.hitstop = Math.max(this.hitstop, c.launch ? 7 : 4);
            }
          }
        }
      } else {
        c.struck = true; c.strikeT = t;
      }
    }
    if (c.struck && t - c.strikeT > 10) {                // vanish in a puff of smoke
      this.effects.spawnSmoke(c.x, c.y - 60, 8);
      return false;
    }
    return true;
  }

  _updateBolt(b, team, enemyTeam, enemy) {
    const o = b.owner;
    if (!b.struck && (o.defeated || o.state === ST.HIT)) {   // Sasuke was interrupted: the storm fizzles
      this.effects.spawnBurst(b.x, 120, '#9fd8ff', 12, 5, 18, 3, 0.05);
      return false;
    }
    if (!b.struck) {
      // The strike tracks the opponent, then locks on so it can be dodged
      if (b.timer < b.lockAt && enemy && !enemy.defeated) b.x += (enemy.x - b.x) * 0.18;
      if (b.timer === b.lockAt) this.effects.spawnBurst(b.x, CFG.FLOOR_Y, '#9fd8ff', 16, 5, 20, 3, -0.05);
      if (b.timer >= b.strikeAt) {
        b.struck = true; b.struckAt = b.timer;
        if (enemy && !enemy.defeated && Math.abs(enemy.x - b.x) < 58) {
          const connected = enemy.takeHit(o, MOVES.kirin, b.damage, 10, 60, enemyTeam, this.effects, { launch: true });
          if (connected) {
            team.gainStorm(4);
            this.effects.spawnHitSpark(enemy.x, enemy.y - 80, '#9fd8ff');
          }
        }
        this.effects.shakeScreen(16);
        this.effects.whiteFlash(0.65);
        this.hitstop = Math.max(this.hitstop, 7);
        const fx2 = this.game.assets.metadata.fx2;
        if (fx2) {
          this.effects.addSpriteEffect(fx2.lightning_pillar, b.x, CFG.FLOOR_Y - 200, 14, 'center', 'fx2', [1.3, 3.2]);
          this.effects.addSpriteEffect(fx2.bolt_base, b.x, CFG.FLOOR_Y - 50, 12, 'center', 'fx2', 1.8);
        }
        this.effects.spawnBurst(b.x, CFG.FLOOR_Y - 10, '#bfe8ff', 26, 9, 28, 3, 0.15);
      }
    }
    return !(b.struck && b.timer - b.struckAt > 16);
  }

  // darkness (0..0.35) while any Kirin storm is gathering
  _stormDarkness() {
    let d = 0;
    for (const team of [this.team1, this.team2]) {
      for (const f of team.fields) if (f.type === 'bolt' && !f.struck) d = Math.max(d, Math.min(1, f.timer / 20) * 0.35);
    }
    return d;
  }

  _drawFields(ctx) {
    for (const team of [this.team1, this.team2]) {
      for (const f of team.fields) {
        if (f.type === 'clone') {
          if (f.timer <= f.delay) continue;
          const t = f.timer - f.delay;
          const idx = f.struck ? Math.min(3, 2 + Math.floor((t - f.strikeT) / 4)) : Math.min(1, Math.floor(t / 4));
          const frame = this.game.assets.getFrame(f.character, 'attack1', idx);
          const atlas = this.game.assets.getAtlas(f.character);
          if (!frame || !atlas) continue;
          const footY = frame.foot_y != null ? frame.foot_y : frame.src_h;
          const centerX = frame.center_x != null ? frame.center_x : frame.src_w / 2;
          ctx.save();
          if (f.facing === -1) { ctx.translate(f.x, 0); ctx.scale(-1, 1); ctx.translate(-f.x, 0); }
          ctx.globalAlpha = 0.88;
          ctx.drawImage(atlas, frame.src_x, frame.src_y, frame.src_w, frame.src_h,
            f.x - centerX, f.y - footY, frame.src_w, frame.src_h);
          ctx.restore();
        } else if (f.type === 'bolt') {
          ctx.save();
          if (!f.struck) {
            // warning ring on the floor + faint crackle in the sky, getting stronger as the strike nears
            const k = f.timer / f.strikeAt;
            ctx.globalAlpha = 0.25 + 0.5 * k;
            ctx.strokeStyle = f.timer >= f.lockAt ? '#ffffff' : '#9fd8ff';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.ellipse(f.x, CFG.FLOOR_Y + 4, 58 * (1.1 - 0.3 * k), 12, 0, 0, Math.PI * 2); ctx.stroke();
            if (f.timer > 8) {
              ctx.globalAlpha = 0.15 + 0.35 * Math.random() * k;
              ctx.lineWidth = 2; ctx.strokeStyle = '#cfeaff';
              ctx.beginPath(); ctx.moveTo(f.x - 40 + Math.random() * 80, 0);
              for (let i = 1; i <= 4; i++) ctx.lineTo(f.x + (Math.random() - 0.5) * 70, i * 30);
              ctx.stroke();
            }
          } else if (f.timer - f.struckAt <= 14) {
            // the strike itself: a jagged bolt from the sky with a white core
            const fade = 1 - (f.timer - f.struckAt) / 16;
            ctx.globalAlpha = Math.max(0, fade);
            ctx.lineJoin = 'round';
            ctx.shadowColor = '#7fd0ff'; ctx.shadowBlur = 24;
            for (const [w, col] of [[10, '#6fc0ff'], [4, '#ffffff']]) {
              ctx.lineWidth = w; ctx.strokeStyle = col;
              ctx.beginPath(); ctx.moveTo(f.x + (Math.random() - 0.5) * 30, 0);
              const N = 9;
              for (let i = 1; i < N; i++) ctx.lineTo(f.x + (Math.random() - 0.5) * 64, (CFG.FLOOR_Y * i) / N);
              ctx.lineTo(f.x, CFG.FLOOR_Y);
              ctx.stroke();
            }
          }
          ctx.restore();
        }
      }
    }
  }

  _updateAssists() {
    for (const team of [this.team1, this.team2]) {
      const enemyTeam = team === this.team1 ? this.team2 : this.team1;
      const enemy = enemyTeam.leader;
      team.assists = team.assists.filter(a => {
        a.timer++;
        // Support fighter dashes toward enemy and attacks
        if (a.timer < 15) {
          // Dash phase: move toward enemy
          if (enemy) {
            const dir = enemy.x > a.x ? 1 : -1;
            a.facing = dir;
            a.x += dir * 8;
          }
        } else if (a.timer < 20) {
          // Attack phase: check hit
          if (!a.attacked && enemy && !enemy.defeated) {
            a.attacked = true;
            const reach = 80;
            const ax = a.facing === 1 ? a.x : a.x - reach;
            const ahb = { x: ax, y: a.y - 130, w: reach, h: 120 };
            const dh = enemy.hurtbox;
            if (ahb.x < dh.x + dh.w && ahb.x + ahb.w > dh.x && ahb.y < dh.y + dh.h && ahb.y + ahb.h > dh.y) {
              const connected = enemy.takeHit(a.owner, MOVES.assist, 30, 8, 20, enemyTeam, this.effects, {});
              if (connected) {
                team.gainStorm(3);
                this.effects.spawnHitSpark(enemy.x, enemy.y - 80, a.owner.data.color);
                this.hitstop = Math.max(this.hitstop, 5);
              }
            }
          }
        } else if (a.timer >= a.maxTimer) {
          // Disappear with smoke
          this.effects.spawnSmoke(a.x, a.y - 60, 6);
          return false;
        }
        return true;
      });
    }
  }

  _drawProjectiles(ctx) {
    for (const team of [this.team1, this.team2]) {
      for (const p of team.projectiles) {
        // Signature projectiles are drawn from the fx2 sprite atlas
        const fxAtlas = this.game.assets.atlases.fx2;
        const fr = p.anim && fxAtlas ? this.game.assets.getFx(p.anim, Math.floor(p.age / 3)) : null;
        if (fr) {
          const w = fr.src_w * p.scale, h = fr.src_h * p.scale;
          ctx.save();
          ctx.translate(p.x, p.y);
          // soft glow behind the sprite
          const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 0.75);
          glow.addColorStop(0, p.color + 'aa'); glow.addColorStop(1, p.color + '00');
          ctx.fillStyle = glow;
          ctx.fillRect(-w, -w, w * 2, w * 2);
          if (p.kind === 'rasenshuriken') ctx.rotate(p.spin * 0.6);
          ctx.drawImage(fxAtlas, fr.src_x, fr.src_y, fr.src_w, fr.src_h, -w / 2, -h / 2, w, h);
          ctx.restore();
          continue;
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.spin);
        // Draw shuriken as a spinning star shape
        ctx.fillStyle = '#cccccc';
        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const angle = (i * Math.PI) / 2;
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(angle) * p.radius, Math.sin(angle) * p.radius);
          ctx.lineTo(Math.cos(angle + 0.3) * p.radius * 0.5, Math.sin(angle + 0.3) * p.radius * 0.5);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // Center dot
        ctx.fillStyle = '#666';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  _drawAssists(ctx) {
    for (const team of [this.team1, this.team2]) {
      for (const a of team.assists) {
        // Draw support fighter sprite
        const frame = this.game.assets.getFrame(a.character, 'attack1', Math.floor(a.timer / 4));
        const atlas = this.game.assets.getAtlas(a.character);
        if (frame && atlas) {
          const footY = frame.foot_y != null ? frame.foot_y : frame.src_h;
          const centerX = frame.center_x != null ? frame.center_x : frame.src_w / 2;
          ctx.save();
          if (a.facing === -1) {
            ctx.translate(a.x, 0);
            ctx.scale(-1, 1);
            ctx.translate(-a.x, 0);
          }
          // Semi-transparent (support fighter)
          ctx.globalAlpha = 0.7;
          const dx = a.x - centerX;
          const dy = a.y - footY;
          ctx.drawImage(atlas, frame.src_x, frame.src_y, frame.src_w, frame.src_h, dx, dy, frame.src_w, frame.src_h);
          ctx.restore();
        }
      }
    }
  }

  _resolveHits(attacker, defender, attTeam, defTeam, comboCounter) {
    if (attacker === defender || attacker.defeated || defender.defeated) return;
    const hb = attacker.hitbox();
    if (!hb) return;
    if (attacker._lastHitTargets.has(defender)) return;
    const dh = defender.hurtbox;
    if (hb.x < dh.x + dh.w && hb.x + hb.w > dh.x && hb.y < dh.y + dh.h && hb.y + hb.h > dh.y) {
      // hit
      const info = MOVES[attacker.state];
      attacker._lastHitTargets.add(defender);
      const opts = {
        launch: !!info.launch, slam: !!info.slam, grab: !!info.grab, melee: true,
      };
      const connected = defender.takeHit(attacker, info, info.damage, info.kb, info.hs, defTeam, this.effects, opts);
      if (connected) {
        comboCounter.registerHit(info.damage);
        attTeam.gainStorm(info.damage >= 30 ? 2 : 1);
        if (info.damage >= 60) this.hitstop = 8;
        else if (info.damage >= 25) this.hitstop = 4;
        if (attacker.state === ST.ULTIMATE) {
          this._triggerCinematic(`${attacker.data.display.toUpperCase()}!\n${attacker.data.ultimate.toUpperCase()}`,
            attacker.data.color, 110, attacker, defender);
          this.effects.shakeScreen(20);
          this.effects.whiteFlash(0.7);
        } else if (attacker.state === ST.LINKED) {
          this._triggerCinematic(`LINKED SECRET!\n${attacker.data.linked.toUpperCase()}`,
            '#ffc83c', 140, attacker, defender);
          this.effects.shakeScreen(28);
          this.effects.whiteFlash(0.85);
        } else if (attacker.state === ST.NINJUTSU) {
          const fxAnim = this.game.assets.metadata.fx.explosion || [];
          if (fxAnim.length > 0) {
            this.effects.addSpriteEffect(fxAnim, defender.x, defender.y - 80, 20, 'center');
          }
          this.effects.shakeScreen(12);
          this.effects.whiteFlash(0.4);
        } else if (attacker.state === ST.GRAB) {
          this.effects.spawnSmoke(defender.x, defender.y - 60, 8);
        }
      }
    }
  }

  draw(ctx) {
    const g = this.game;
    ctx.drawImage(g.bg, 0, 0);
    const storm = this._stormDarkness();
    if (storm > 0) { ctx.fillStyle = `rgba(8,12,40,${storm})`; ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H); }
    const [sx, sy] = this.effects.getShakeOffset();
    ctx.save();
    ctx.translate(sx, sy);

    this.team1.leader.draw(ctx, this.effects);
    this.team2.leader.draw(ctx, this.effects);
    // Draw assist support fighters (behind projectiles)
    this._drawAssists(ctx);
    this._drawFields(ctx);
    this.effects.drawSprites(ctx, g.assets);
    // Draw projectiles (shuriken) on top
    this._drawProjectiles(ctx);
    this.effects.drawParticles(ctx);

    ctx.restore();

    // HUD
    const fonts = g.fonts;
    this.hud1.draw(ctx, fonts);
    this.hud2.draw(ctx, fonts);
    this.combo1.draw(ctx, fonts);
    this.combo2.draw(ctx, fonts);

    // Timer
    ctx.save();
    ctx.font = fonts.big;
    ctx.fillStyle = this.roundTime > 10 ? COLORS.TEXT : '#ff5050';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const timerStr = String(Math.max(0, Math.ceil(this.roundTime))).padStart(2, '0');
    const tw = ctx.measureText(timerStr).width;
    ctx.fillStyle = '#000';
    ctx.fillRect(CFG.SCREEN_W / 2 - tw / 2 - 10, 22, tw + 20, 36);
    ctx.strokeStyle = COLORS.ACCENT;
    ctx.lineWidth = 2;
    ctx.strokeRect(CFG.SCREEN_W / 2 - tw / 2 - 10, 22, tw + 20, 36);
    ctx.fillStyle = this.roundTime > 10 ? COLORS.TEXT : '#ff5050';
    ctx.fillText(timerStr, CFG.SCREEN_W / 2, 40);
    ctx.restore();

    // Swap flash rings
    for (const team of [this.team1, this.team2]) {
      if (team.swapFlashTimer > 0) {
        team.swapFlashTimer--;
        const r = 40 + (12 - team.swapFlashTimer) * 4;
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(team.leader.x, team.leader.y - 80, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    this.effects.drawOverlay(ctx);

    if (this.roundState === 'intro') {
      ctx.save();
      ctx.font = fonts.huge;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const alpha = Math.min(1, this.stateTimer / 30);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#000';
      ctx.fillText('READY?', CFG.SCREEN_W / 2 + 3, CFG.SCREEN_H / 2 - 47);
      ctx.fillStyle = COLORS.TEXT;
      ctx.fillText('READY?', CFG.SCREEN_W / 2, CFG.SCREEN_H / 2 - 50);
      ctx.restore();
    }

    // Footer hint / training banner
    ctx.save();
    ctx.textAlign = 'left';
    ctx.font = '13px Arial';
    ctx.fillStyle = 'rgba(200,200,220,0.7)';
    if (this.training) {
      const m = this.cpu ? this.cpu.mode : 'ai';
      ctx.fillStyle = COLORS.ACCENT;
      ctx.fillText(`TRAINING   dummy: ${m.toUpperCase()}   |   T: change dummy   H: controls   ESC: exit`, 20, CFG.SCREEN_H - 14);
    } else {
      ctx.fillText('H: controls', 20, CFG.SCREEN_H - 14);
    }
    ctx.restore();

    if (this.showHelp) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);
      drawControlsPanel(ctx);
      ctx.save(); ctx.font = '16px Arial'; ctx.fillStyle = COLORS.TEXT_DIM; ctx.textAlign = 'center';
      ctx.fillText('PAUSED  -  press H or ESC to resume', CFG.SCREEN_W / 2, CFG.SCREEN_H - 20);
      ctx.restore();
    }

    if (g.debug) {
      const f1 = this.team1.leader, f2 = this.team2.leader;
      ctx.save();
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 1;
      const dh = f1.hurtbox;
      ctx.strokeRect(dh.x, dh.y, dh.w, dh.h);
      const hb = f1.hitbox();
      if (hb) { ctx.strokeStyle = '#f00'; ctx.strokeRect(hb.x, hb.y, hb.w, hb.h); }
      const dh2 = f2.hurtbox;
      ctx.strokeStyle = '#0f0';
      ctx.strokeRect(dh2.x, dh2.y, dh2.w, dh2.h);
      const hb2 = f2.hitbox();
      if (hb2) { ctx.strokeStyle = '#f00'; ctx.strokeRect(hb2.x, hb2.y, hb2.w, hb2.h); }
      ctx.font = fonts.small;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.fillText(`P1 ${f1.state} t=${f1.stateTimer} ch=${Math.floor(f1.chakra)} | P2 ${f2.state} t=${f2.stateTimer} ch=${Math.floor(f2.chakra)}`,
        20, CFG.SCREEN_H - 60);
      ctx.restore();
    }
  }
}

class ResultScene {
  constructor(game, winner, team1, team2) {
    this.game = game;
    this.winner = winner;
    this.team1 = team1;
    this.team2 = team2;
    this.t = 0;
  }
  update(dt, events) {
    this.t++;
    for (const e of events) {
      if (e.type !== 'keydown') continue;
      if (e.code === 'Enter' || e.code === 'Space') this.game.scene = new TeamSelectScene(this.game);
      else if (e.code === 'Escape') this.game.scene = new TitleScene(this.game);
    }
  }
  draw(ctx) {
    const g = this.game;
    ctx.drawImage(g.bg, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);
    // winner: 1 = P1, 2 = P2 / CPU, 0 = draw (time up with equal health)
    const team = this.winner === 2 ? this.team2 : this.team1;
    const leader = team.leader;
    let title;
    if (this.winner === 0) title = 'DRAW GAME';
    else if (this.winner === 2 && g.cpuMode !== false) title = 'CPU WINS!';
    else title = `PLAYER ${this.winner} WINS!`;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 64px "Trebuchet MS", Arial';
    ctx.fillStyle = '#000';
    ctx.fillText(title, CFG.SCREEN_W / 2 + 3, 223);
    ctx.fillStyle = COLORS.ACCENT;
    ctx.fillText(title, CFG.SCREEN_W / 2, 220);
    ctx.font = 'bold 32px "Trebuchet MS", Arial';
    ctx.fillStyle = COLORS.TEXT;
    if (this.winner !== 0) ctx.fillText(`${leader.data.display} - ${leader.data.subtitle}`, CFG.SCREEN_W / 2, 290);
    // Winner sprite
    const frame = leader.assets.getFrame(leader.character, 'idle', 0);
    const atlas = leader.assets.getAtlas(leader.character);
    if (frame && atlas) {
      const scale = 4;
      const dw = frame.src_w * scale, dh = frame.src_h * scale;
      ctx.drawImage(atlas, frame.src_x, frame.src_y, frame.src_w, frame.src_h,
        CFG.SCREEN_W / 2 - dw / 2, CFG.FLOOR_Y - dh, dw, dh);
    }
    if (this.t % 60 < 40) {
      ctx.font = 'bold 24px "Trebuchet MS", Arial';
      ctx.fillStyle = COLORS.TEXT;
      ctx.fillText('ENTER: Rematch   |   ESC: Title', CFG.SCREEN_W / 2, CFG.FLOOR_Y - 60);
    }
    ctx.restore();
  }
}

// ============================================================================
// GAME
// ============================================================================
class Game {
  constructor() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    this.assets = new AssetManager();
    this.input1 = new InputMapper(P1_KEYS);
    this.input2 = new InputMapper(P2_KEYS);
    this.running = false;
    this.debug = false;
    this.bg = null;
    this.scene = null;
    this.fonts = {
      huge: 'bold 64px "Trebuchet MS", Arial',
      big: 'bold 40px "Trebuchet MS", Arial',
      med: 'bold 22px "Trebuchet MS", Arial',
      small: '14px Arial',
    };
    this._events = [];
    this._lastTime = 0;
  }

  async start() {
    const loading = document.getElementById('loading');
    const fill = document.getElementById('loadFill');
    await this.assets.loadAll((loaded, total) => {
      const pct = (loaded / total) * 100;
      fill.style.width = pct + '%';
    });
    this.bg = makeBackground(this.ctx);
    this.scene = new TitleScene(this);
    loading.style.display = 'none';
    this.running = true;

    // Input listeners
    // Keys the game uses that the browser would otherwise act on: page scroll (arrows/space),
    // focus change (Tab), help (F1), Firefox quick-find ('/' = P2 Guard, ' ), etc.
    const gameCodes = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','F1',
      'Slash','Quote','Period','Comma','Semicolon','BracketLeft','BracketRight']);
    window.addEventListener('keydown', (e) => {
      if (gameCodes.has(e.code)) e.preventDefault();
      // OS key-repeat must not re-fire menu/dialogue events (holding ENTER skipped whole dialogues)
      if (!e.repeat) this._events.push({ type: 'keydown', code: e.code });
      this.input1.keyDown(e.code);
      this.input2.keyDown(e.code);
    });
    window.addEventListener('keyup', (e) => {
      this._events.push({ type: 'keyup', code: e.code });
      this.input1.keyUp(e.code);
      this.input2.keyUp(e.code);
    });
    // If the window loses focus the keyup never arrives -> the fighter keeps walking forever
    window.addEventListener('blur', () => {
      this.input1.releaseAll();
      this.input2.releaseAll();
    });

    // Focus canvas
    this.canvas.tabIndex = 0;
    this.canvas.focus();

    // Main loop - fixed 60 Hz logic step. All game logic is counted in frames, so running one
    // update per requestAnimationFrame made the game 2x-2.4x too fast on 120/144 Hz monitors.
    const STEP = 1 / 60;
    let acc = 0;
    this._lastTime = performance.now();
    const loop = (t) => {
      if (!this.running) return;
      acc += Math.min((t - this._lastTime) / 1000, 0.25);
      this._lastTime = t;
      let steps = 0;
      while (acc >= STEP && steps < 5) {
        this.update(STEP);
        acc -= STEP;
        steps++;
      }
      if (steps === 5) acc = 0; // too far behind (slow device / background tab) - don't spiral
      this.draw();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  update(dt) {
    const events = this._events;
    this._events = [];
    this.scene.update(dt, events);
  }

  draw() {
    this.ctx.clearRect(0, 0, CFG.SCREEN_W, CFG.SCREEN_H);
    this.scene.draw(this.ctx);
  }
}

// Bootstrap
window.addEventListener('load', () => {
  const game = new Game();
  window._game = game; // expose for debugging
  game.start().catch(err => {
    console.error('Failed to start game:', err);
    document.getElementById('loading').innerHTML =
      '<div style="color:#f80;">Failed to load. Make sure the page is served via http:// (not file://)<br>Run: python3 -m http.server in this folder</div>';
  });
});
</script>
